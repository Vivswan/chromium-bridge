# Inherited by every moon project.
#
# Every task is uncached unless it says otherwise: moon's hasher cannot see gitignored inputs (the
# generated .wxt/tsconfig.json) and a mistaken hasher.ignorePatterns entry drops tracked files from every
# hash, so a cache hit could let unverified code land. The tools underneath (cargo, tsc, vite, bun) keep
# their own incremental caches, so warm reruns stay fast.
#
# THE CONTRACT EDGE. The Rust core is the canonical cross-process contract: the gen-shared task runs the
# contract emitters (scripts/gen-ops.ts drives the core's emit_contract example, scripts/gen-envelope.ts
# the wire-schema emission) and writes the gitignored src/packages/shared/generated/ modules. Downstream
# TS tasks (shared, extension) depend on that task and declare this group as an input so a change anywhere
# in the core crate invalidates their caches. Deliberately over-broad (the whole crate, every gen-*.ts
# script, everything that decides what emit_contract compiles to) because a stale cache hit on the contract
# path is the one failure mode this repo cannot accept.
$schema: 'https://moonrepo.dev/schemas/tasks.json'

taskOptions:
  cache: false

fileGroups:
  rust-contract:
    - '/src/packages/core/**/*'
    - '/scripts/gen-*.ts'
    - '/Cargo.toml'
    - '/Cargo.lock'
    - '/rust-toolchain.toml'
