# moon workspace registry.
#
# moon is the canonical command interface: `moon run ci` is the gate, `moon query tasks`
# is the menu, and CI runs moon tasks directly. proto (.prototools) provisions moon
# itself. See docs/development.md ("moon: the canonical command interface").
$schema: 'https://moonrepo.dev/schemas/workspace.json'

# Lets unscoped targets (`moon run ci`, `moon run gen`, ...) resolve to the
# root project, whose moon.yml holds every repo-wide task and runbook.
defaultProject: 'root'

projects:
  # The workspace root itself: repo-wide Biome tasks (lint/check/fmt-check)
  # that have no single-project home.
  root: '.'
  core: 'src/packages/core'
  shared: 'src/packages/shared'
  extension: 'src/apps/extension'
  desktop-ui: 'src/apps/desktop/ui'
  web: 'src/apps/web'

vcs:
  client: 'git'
  defaultBranch: 'main'

# moon's file walk does not honor .gitignore, so build output is kept out of every task hash here;
# each pattern is '**/'-prefixed because moon only reliably matches with a leading '**'.
#   missing pattern                  -> over-invalidates or fails a run loudly
#   pattern matching a TRACKED file  -> silently drops it from every hash (a stale-cache hole);
#                                       scripts/check-moon-hasher.ts (`moon run check-hasher`, in the ci gate) refuses it
hasher:
  ignorePatterns:
    - '**/node_modules/**'
    - '**/*.tsbuildinfo'
    - '**/__pycache__/**'
    - '**/.moon/cache/**'
    - '**/.worktrees/**'
    - '**/build/**'
    - '**/src/apps/desktop/gen/**'
    - '**/src/apps/desktop/icons/**'
    - '**/.wxt/**'
    - '**/src/public/icons/**'
    - '**/.astro/**'
    - '**/fuzz/artifacts/**'
    - '**/fuzz/corpus/**'
    - '**/fuzz/coverage/**'
    - '**/fuzz/failures/**'
    - '**/target/**'
    - '**/tests/.chrome-for-testing/**'
    - '**/tests/chrome/**'
    - '**/tests/chromium/**'
    - '**/tmp/**'
