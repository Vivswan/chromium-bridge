# Generated once by the fleet sync and repo-owned from then on: the sync reads this file and never rewrites it.
modules:
  - bun
  - rust
  - pages
  - release-please
  - issue-templates
  - pr-title
  - fuzzer
  - nightly
project:
  name: Chromium Bridge
  slug: chromium-bridge
  description: "Authenticated MCP bridge to your real Chromium browsers (Brave, Chrome): Rust native-messaging host + MV3 extension, no debug port"
  copyright_holder: Vivswan Shah (https://github.com/Vivswan)
pages:
  setup: bun
  build: ASTRO_BASE="$PAGES_BASE_PATH" ASTRO_SITE="$PAGES_ORIGIN" bun run --cwd src/apps/web build
  dist: build/web
