# typos (https://github.com/crate-ci/typos) - source-code spell checker.
# Run via `moon run typos`; wired into `moon run ci` and the lefthook pre-commit hook.

[files]
# The generated release history is not ours to respell; localized docs will
# arrive with the translation phases.
extend-exclude = ["CHANGELOG.md"]

[default]
extend-ignore-re = [
    # RFC 4648 base64 test vectors ("f", "fo", "foo", ...) in encoding tests.
    'b"fo"',
]

[default.extend-words]
# COSE = CBOR Object Signing and Encryption (RFC 9052): the WebAuthn credential public key format.
cose = "cose"
# IIFE = immediately-invoked function expression (esbuild output format).
iif = "iif"
# UDID = Apple's unique device identifier (provisioning profiles).
udid = "udid"

[default.extend-identifiers]
# security-framework 3.7.0 misspells its own method; we must call it as spelled.
copy_guest_with_attribues = "copy_guest_with_attribues"
