# Pushing needs packages: write, which checks.yml's jobs cannot hold (the caller runs them with
# contents: read), so publishing the image compose.yaml builds is its own workflow. GHCR creates the
# package private on first push; make it public once in the package settings.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - .prototools
      - rust-toolchain.toml
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read

# Runs serialize, so no other run of this workflow pushes between a run's head check and its own push.
# GitHub keeps one pending run per group: a push superseded before its run starts is cancelled, and its
# content tag is published by a manual dispatch if ever needed.
concurrency:
  group: container-image
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push the CI image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The .bun-version bun, only to run the coordinates script; the image installs its own through proto.
      # No cache: this workflow publishes, and a restored cache is an input to what it publishes.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Image name, tag, and proto pin
        id: image
        # The tag hashes every build input by name and content (scripts/ci-image.ts: the Containerfile,
        # .dockerignore, and what .dockerignore admits), and the proto pin is the Containerfile's one
        # build arg.
        run: bun scripts/ci-image.ts coordinates
      - name: Is this commit still the head of main
        id: latest
        # A re-run or a late finish of an older main commit must not move `latest` backward.
        run: bun scripts/ci-image.ts latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          build-args: PROTO_VERSION=${{ steps.image.outputs.proto }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.latest.outputs.publish == 'true' && format('{0}:latest', steps.image.outputs.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
