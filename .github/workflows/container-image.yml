# Pushing needs packages: write, which checks.yml's jobs cannot hold (the caller runs them with
# contents: read), so publishing the image compose.yaml builds is its own workflow. GHCR creates the
# package private on first push; make it public once in the package settings.
#
# Trust boundary. YAML a pull request controls holds no package token: the `build` job below runs on
# pull_request with contents: read and pushes nothing. Nothing a pull request produced is ever pushed:
# container-image-publish.yml, which runs main's own definition after this workflow completes, rebuilds
# from the pull request's merge checkout and pushes the content tag alone. A fork's pull request builds
# nothing here (scripts/ci-image.ts eligible). What a pull request's YAML can still do by default, grant
# itself packages: write and push any tag, is made harmless by the consumer: checks.yml's image job pins
# only a digest whose provenance attestation was signed by this workflow or the publisher on main.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .dockerignore
      - .prototools
      - rust-toolchain.toml
      - .github/workflows/container-image.yml
  pull_request:
    paths:
      - Containerfile
      - .dockerignore
      - .prototools
      - rust-toolchain.toml
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read

# Main's runs serialize, so no other run of this workflow pushes between a run's head check and its own
# push. GitHub keeps one pending run per group: a push superseded before its run starts is cancelled, and
# its content tag is published by a manual dispatch if ever needed. A pull request's runs take their own
# lane, where a newer push cancels the stale build.
concurrency:
  group: container-image-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build-only: proves the pull request's Containerfile builds, fails the pull request fast when it does
  # not, and is the run container-image-publish.yml follows. No login, no push, no token beyond the
  # read-only default; the gha cache it writes is scoped to the pull request.
  build:
    name: Build the CI image from the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - id: eligible
        env:
          PUBLISH_EVENT: ${{ github.event_name }}
          PUBLISH_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: bun scripts/ci-image.ts eligible
      # The same materialized context the publisher builds from, so a Containerfile that copies a file the
      # tag does not hash fails here first.
      - if: steps.eligible.outputs.eligible == 'true'
        env:
          CI_IMAGE_CONTEXT: image-context
        run: bun scripts/ci-image.ts context
      - if: steps.eligible.outputs.eligible == 'true'
        id: image
        env:
          CI_IMAGE_ROOT: image-context
        run: bun scripts/ci-image.ts coordinates
      - if: steps.eligible.outputs.eligible == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.eligible.outputs.eligible == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: image-context
          file: image-context/Containerfile
          platforms: ${{ steps.image.outputs.platform }}
          push: false
          build-args: PROTO_VERSION=${{ steps.image.outputs.proto }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # id-token and attestations: the pushed digest's provenance is signed as this workflow on main, which
  # checks.yml's image job requires before it pins any image.
  publish:
    name: Build and push the CI image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The .bun-version bun, only to run the coordinates script; the image installs its own through proto.
      # No cache: this workflow publishes, and a restored cache is an input to what it publishes.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      # The build context is written from this commit's blobs: exactly the files the tag hashes.
      - env:
          CI_IMAGE_CONTEXT: image-context
        run: bun scripts/ci-image.ts context
      - name: Image name, tag, and proto pin
        id: image
        # The tag hashes every build input by name and content (scripts/ci-image.ts: the Containerfile,
        # .dockerignore, and what .dockerignore admits), and the proto pin is the Containerfile's one
        # build arg.
        env:
          CI_IMAGE_ROOT: image-context
        run: bun scripts/ci-image.ts coordinates
      - name: Is this commit still the head of main
        id: latest
        # A re-run or a late finish of an older main commit must not move `latest` backward.
        run: bun scripts/ci-image.ts latest
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: image-context
          file: image-context/Containerfile
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          build-args: PROTO_VERSION=${{ steps.image.outputs.proto }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.latest.outputs.publish == 'true' && format('{0}:latest', steps.image.outputs.name) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
