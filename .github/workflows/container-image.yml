# Publishes the image compose.yaml builds locally, so CI jobs can later pull it instead of
# provisioning a toolchain per run. The tag is the first 12 hex digits of the sha256 over every file the
# image is built from, so a changed pin is a new tag and an unchanged one is the same image; `latest`
# follows main only (a manual dispatch from another branch publishes its content tag alone). Pushing is
# an action on the registry, so this stays its own workflow (checks.yml jobs run with contents: read
# only).
#
# Built for linux/amd64 (the runner's own architecture); arm64 hosts build locally through compose.
# The package is created private on first push; make it public once in the package settings.

name: Container image

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .prototools
      - rust-toolchain.toml
      - .github/workflows/checks.yml
      - scripts/container-entrypoint.sh
      - .github/workflows/container-image.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build and push ghcr.io/vivswan/chromium-bridge-ci
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag from the build inputs
        id: tag
        run: |
          tag="$(cat Containerfile .prototools rust-toolchain.toml .github/workflows/checks.yml scripts/container-entrypoint.sh | sha256sum | cut -c1-12)"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/vivswan/chromium-bridge-ci:${{ steps.tag.outputs.tag }}
            ${{ github.ref == 'refs/heads/main' && 'ghcr.io/vivswan/chromium-bridge-ci:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
