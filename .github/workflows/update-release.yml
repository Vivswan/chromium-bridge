# The update stage of the release pipeline: repo-owned, generated once by
# the fleet sync and never overwritten by it. The managed
# ci.yml's update-release job calls this workflow between cutting the draft
# release (the fleet's release leg) and the attested publish (the fleet's
# publish-release leg), so everything this repository wants on the release
# happens here: packaging, asset uploads, note edits. Add jobs freely -
# publishing waits for every job in this file, and every asset uploaded
# here is attested at publish time into the release's single
# attestation.json. Recovery when a run dies mid-pipeline and the jobs
# themselves are documented in docs/release.md.

name: Update Release

on:
  workflow_call:
    inputs:
      tag:
        description: The draft release's tag (forced at creation, so it is checkout-able before publication)
        required: true
        type: string

jobs:
  binaries:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    permissions:
      contents: write # upload assets to the GitHub Release
      id-token: write # OIDC token to sign the SLSA build provenance
      attestations: write # write the build-provenance attestation
    strategy:
      fail-fast: false
      matrix:
        include:
          # Intel (x64) macOS is intentionally NOT built and will not be
          # re-added: Apple Silicon is the supported macOS target. Rosetta 2
          # only translates x86_64 to run on Apple Silicon, not the reverse,
          # so it cannot run the arm64 build on an Intel Mac - Intel users
          # must build from source.
          - os: macos-14
            platform: macos
            arch: arm64
          # Build on an older glibc baseline for wider Linux compatibility.
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      # Pass the tag through the environment, never spliced into a run: script,
      # so it cannot break out of a shell command. The Verify step below also
      # constrains its shape (this workflow has contents/id-token/attestations
      # write).
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pin to the tag release-please just published: this run's own sha
          # IS that commit today, but the tag is what users verify against.
          ref: ${{ inputs.tag }}
          # Full history: this job runs moon, whose changed-files query reads a base ref.
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"

      - name: Verify tag matches Cargo version
        run: bun scripts/release-package.ts verify-tag

      - name: Build binary (deterministic)
        # build-repro.ts pins SOURCE_DATE_EPOCH and remaps build paths so the
        # binary is bit-for-bit reproducible from the tag with the pinned
        # toolchain; see SECURITY.md "Release artifact integrity". It is
        # self-contained (no bun install needed; the bun setup-moon provisions suffices).
        shell: bash
        run: bun scripts/build-repro.ts

      # extension:build generates the contract modules and the WXT types first (its gen tasks' cargo runs take
      # --frozen, which never fetches, so the crates are fetched first). One step per command: the Windows leg
      # runs a block under PowerShell, where a failed native command does not stop the next one.
      - run: bun install --frozen-lockfile
      - run: cargo fetch --locked
      - run: cargo fetch --locked --manifest-path src/packages/core/fuzz/Cargo.toml
      - name: Build extension bundle
        run: moon run extension:build

      - name: Package release archive
        id: pkg
        run: bun scripts/release-package.ts archive

      # The built extension bundle is platform-independent, so ONLY the
      # macos/arm64 leg builds the standalone zip - every leg uploading the
      # same asset name would conflict. Its upload is the separate macos-only
      # Publish step below, so the shared Publish step's file list never
      # carries patterns that are blank on the other legs.
      - name: Package standalone extension zip
        id: extzip
        if: matrix.platform == 'macos'
        run: bun scripts/release-package.ts extension-zip

      # The pin is the Containerfile's, read like cargo-machete's in checks.yml. cargo-deb wraps the built
      # binary (--no-build --no-strip in the script) so the .deb ships the attested bytes.
      - id: pin
        if: matrix.platform == 'linux'
        run: bun scripts/pin.ts cargo-deb --output deb
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: matrix.platform == 'linux'
        with:
          tool: cargo-deb@${{ steps.pin.outputs.deb }}

      # One installer per leg (.pkg, .deb, .msi), each running the binary's own `doctor --fix` as its
      # post-install (packaging/). Unsigned: the signing and notarization switch is in docs/release.md.
      - name: Package installer
        id: installer
        run: bun scripts/release-package.ts installer

      # Per-asset attestation on top of the managed publish stage's global
      # attestation.json: that stage only attests release ASSETS, and the
      # bare binary inside the archive is not one - users verify after
      # extraction, so `gh attestation verify` needs a subject whose digest
      # matches the shipped binary itself.
      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pkg.outputs.archive }}
            ${{ steps.pkg.outputs.binary }}
            ${{ steps.installer.outputs.installer }}

      # Attest the standalone extension zip on the same (macos) leg that built it.
      - name: Attest extension zip provenance
        if: matrix.platform == 'macos'
        id: attest-extzip
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.extzip.outputs.name }}.zip

      # The Sigstore bundle ships as a release asset next to the artifacts it
      # covers, so `gh attestation verify <asset> --repo Vivswan/genkan
      # --bundle <file>` verifies against the frozen release without depending
      # on GitHub's attestations API. One bundle covers the archive, the bare
      # binary, and the installer - which is why it is named after the shared
      # release stem rather than any one file - and verify picks the entry
      # matching the asset's digest.
      - name: Attach release archive and installer to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.pkg.outputs.archive }}
          SHA256FILE: ${{ steps.pkg.outputs.sha256file }}
          BINSHA256FILE: ${{ steps.pkg.outputs.binsha256file }}
          INSTALLER: ${{ steps.installer.outputs.installer }}
          INSTALLERSHA256FILE: ${{ steps.installer.outputs.installersha256file }}
          NAME: ${{ steps.pkg.outputs.name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        shell: bash
        run: |
          cp "$BUNDLE" "$NAME.attestation.jsonl"
          gh release upload "$RELEASE_TAG" "$ARCHIVE" "$SHA256FILE" "$BINSHA256FILE" \
            "$INSTALLER" "$INSTALLERSHA256FILE" "$NAME.attestation.jsonl" --clobber

      # The standalone extension zip rides its own macos-only upload (matching
      # the extzip step above): each asset is named explicitly and must exist
      # on this leg, so `gh release upload` fails loudly on a missing file.
      - name: Attach extension zip to the draft release
        if: matrix.platform == 'macos'
        env:
          GH_TOKEN: ${{ github.token }}
          EXTZIP: ${{ steps.extzip.outputs.name }}
          BUNDLE: ${{ steps.attest-extzip.outputs.bundle-path }}
        shell: bash
        run: |
          cp "$BUNDLE" "$EXTZIP.zip.attestation.jsonl"
          gh release upload "$RELEASE_TAG" "$EXTZIP.zip" "$EXTZIP.zip.sha256" \
            "$EXTZIP.zip.attestation.jsonl" --clobber

  # CycloneDX SBOM from the committed lockfiles (Cargo.lock + bun.lock),
  # scanning declared dependencies rather than an installed tree (a fresh
  # checkout has no node_modules/target). It attaches to the DRAFT: the
  # release is immutable once published, so a decoupled `release: published`
  # workflow could never attach it. The managed publish stage waits for
  # every job in this file, so this job is continue-on-error: an
  # SBOM-tooling failure still cannot block shipping the binaries - the
  # release just goes out without an SBOM (and the annotated failure on
  # the run flags it).
  sbom:
    continue-on-error: true
    runs-on: ubuntu-22.04
    permissions:
      contents: write # attach the SBOM asset to the draft release
      id-token: write # OIDC token to sign the SLSA build provenance
      attestations: write # write the build-provenance attestation
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Build the SBOM from the exact released code.
          ref: ${{ inputs.tag }}
      # Only the tag check runs under this bun; scripts/release-package.ts imports nothing installed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Verify tag matches Cargo version
        run: bun scripts/release-package.ts verify-tag

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: genkan.cdx.json
          # Keep a CI artifact too; the release attach is the explicit step
          # below so the target tag is deterministic.
          upload-artifact: true
          upload-release-assets: false

      # The SBOM is a downloadable release asset like the archives, so it
      # gets the same provenance attestation: `gh attestation verify
      # genkan.cdx.json --repo <this repo>` must work on it after
      # download.
      - name: Attest SBOM provenance
        id: attest-sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: genkan.cdx.json

      - name: Attach SBOM to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest-sbom.outputs.bundle-path }}
        shell: bash
        run: |
          cp "$BUNDLE" genkan.cdx.json.attestation.jsonl
          gh release upload "$RELEASE_TAG" genkan.cdx.json \
            genkan.cdx.json.attestation.jsonl --clobber

  # The Homebrew formula bump rides the release as a pull request on the tap repository, pushed with the
  # platform token (github.token cannot reach another repository). The tap is the owner's to create and
  # to merge into; until it exists this job fails, and continue-on-error keeps that from blocking the
  # release, as with the SBOM. It runs after binaries because the formula carries the two archive
  # checksums those legs uploaded.
  homebrew:
    needs: [binaries]
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: write # the release is still a draft, which GitHub shows only to push access, so read-only gets "release not found"
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      TAP_REPOSITORY: Vivswan/homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      # Only the tag check and the formula renderer run under this bun; scripts/release-package.ts imports
      # nothing installed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Verify tag matches Cargo version
        run: bun scripts/release-package.ts verify-tag
      - name: Download the archive checksums from the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$RELEASE_TAG" --pattern '*.tar.gz.sha256'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN }}
          path: tap
      - name: Render the formula into the tap checkout (final tags alone)
        id: formula
        env:
          FORMULA_PATH: tap/Formula/genkan.rb
        run: bun scripts/release-package.ts brew-formula
      - name: Open the bump pull request on the tap
        if: steps.formula.outputs.bump == 'true'
        working-directory: tap
        env:
          GH_TOKEN: ${{ secrets.REPO_PLATFORM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "genkan-$RELEASE_TAG"
          git add Formula/genkan.rb
          git commit -m "genkan $RELEASE_TAG"
          git push --force-with-lease origin "HEAD:genkan-$RELEASE_TAG"
          gh pr create --head "genkan-$RELEASE_TAG" --title "genkan $RELEASE_TAG" \
            --body "Formula bump for https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG"

  # Any tag with a suffix (v0.1.0-dev, -rc.1, ...) is a prerelease. Set the
  # flag on the DRAFT: the managed publish stage only flips draft=false, so
  # the prerelease bit must already be in place when it does. Runs after
  # binaries so the draft is only mutated once the packaging legs have
  # validated the tag against Cargo (matching the old pipeline, which set
  # the flag at publish time after every gate); the shape re-check below
  # keeps this job fail-closed on its own inputs too.
  mark-prerelease:
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write # edit the draft release
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      # The checkout carries only the script; the token stays out of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Flag suffixed tags as prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/release-package.ts prerelease

  # Re-encodes the old publish gate inside the hook: the managed publish
  # stage only sees this workflow's aggregate result, and a SKIPPED job
  # does not fail a workflow, so an unexpected skip (a future `if:` on a
  # packaging job) would otherwise slip through to publication. This job
  # always runs (unless the run is cancelled) and fails unless every job
  # succeeded. sbom and homebrew are continue-on-error, so their failures
  # already read as success here; a skip or cancellation blocks. Both conditions read every
  # entry of `needs`, so a job added to the list is folded in by itself.
  release-ready:
    name: allowed to publish?
    needs: [binaries, sbom, homebrew, mark-prerelease]
    if: ${{ !cancelled() }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: echo "::error::refusing to let the release publish, job results $RESULTS" && exit 1
