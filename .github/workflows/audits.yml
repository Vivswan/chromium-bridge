# The cargo deny pass, defined once and called from two places: checks.yml
# runs it inside the all-green merge gate (a new advisory lands as a red PR
# check, not a silent scheduled failure), and nightly.yml reruns it daily for
# advisories disclosed between pushes.
#
# cargo deny is the whole job on purpose. Its advisories check reads the same
# RustSec database cargo audit does (yanked crates included, `yanked = "deny"`
# in deny.toml), and the fleet's Trivy step in the managed ci.yml gates
# Cargo.lock and bun.lock at HIGH/CRITICAL. What the retired bun audit leg
# gated and Trivy does not (dev-only packages, unfixed advisories) is an
# accepted cut recorded in SECURITY.md.
name: Audits

on:
  workflow_call:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny (advisories, licenses, bans, sources)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          # Pinned: the tool's verdict gates the build, so its version must
          # not drift underneath us. Bump deliberately.
          tool: cargo-deny@0.20.2
      - run: cargo deny check
      # The fuzz crate is its own workspace, excluded from the root one, so
      # the root pass above never sees its lockfile - gate it separately with
      # its own config (the shipped gate stays strict; see the fuzz deny.toml).
      # --locked, as in checks.yml: an audit over a stale fuzz lock would
      # judge whatever crates.io resolves that day, not the committed graph.
      - name: cargo deny (fuzz workspace)
        run: cargo deny --locked --manifest-path src/packages/core/fuzz/Cargo.toml --config src/packages/core/fuzz/deny.toml check
