# The release-PR hook of the release pipeline: repo-owned, generated once by the fleet sync and never
# overwritten by it. The managed ci.yml's update-release-pr job calls this workflow from the main-push run
# in which release-please created or refreshed the release PR, so everything this repository wants on that
# PR happens here. Add jobs freely - releases never wait on this path.
#
# release-please bumps Cargo.toml and the extension package.json (extra-files) and no lockfile, so the
# release PR fails every --locked step until scripts/refresh-lockfiles.ts re-locks and commits; the push
# below carries that commit to the PR branch. The push cannot loop back into this hook, which only runs
# off a push to main:
#
#   github.token push         -> triggers no workflow at all (GitHub's recursion guard), so the PR's checks
#                                still need the close/reopen in docs/release.md
#   REPO_PLATFORM_TOKEN push  -> runs the PR's own pull_request CI, which is what the lockfiles are for
#   release-please refresh    -> rebuilds the PR branch from main and drops the commit; that run's call of
#                                this hook adds it again

name: Update Release PR

on:
  workflow_call:
    inputs:
      # The caller's contract; nothing here reads it yet.
      pr_number:
        description: The release PR's number
        required: true
        type: string
      head_branch:
        description: The release PR's head branch (push updates back to it)
        required: true
        type: string

jobs:
  refresh-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # the lockfile commit is pushed back to the PR branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.head_branch }}
          token: ${{ secrets.REPO_PLATFORM_TOKEN || github.token }}
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - name: Re-lock the bumped workspace and push the commit
        env:
          HEAD_BRANCH: ${{ inputs.head_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun scripts/refresh-lockfiles.ts
          git push origin "HEAD:$HEAD_BRANCH"
