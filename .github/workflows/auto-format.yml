# Repo-owned auto-format: label a pull request `fix-lint` (the label ships
# with the template's settings.yml) and this workflow pushes a formatting
# commit to the PR branch, then removes the label. Generated once by the
# fleet sync and never overwritten by it: adjust the format commands to
# this repository's tooling.

name: Auto Format

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  format:
    # Same-repo PRs only: GITHUB_TOKEN cannot push to a fork's branch, and
    # PR-controlled tool configuration should not run next to write
    # credentials (checkout below persists none; the push step scopes them).
    if: github.event.label.name == 'fix-lint' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      # The repo's pinned biome (a devDependency, resolved from bun.lock) -
      # not a floating registry fetch - so this formats exactly like
      # `moon run fix` and the extension job's biome gate. `biome check` lints
      # as well as formats, and its project-domain rules index the generated
      # contract modules, so they are built from the Rust core first (the gen
      # tasks' cargo runs take --frozen, which never fetches).
      - run: bun install --frozen-lockfile
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path src/packages/core/fuzz/Cargo.toml
      - run: moon run gen-shared
      - name: Format (biome)
        run: bun x biome check --write .

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: bun scripts/auto-format-commit.ts
      # The label is a one-shot request: remove it even when a step failed,
      # so a broken run cannot loop.
      - name: Remove the fix-lint label
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR_URL" --remove-label fix-lint
