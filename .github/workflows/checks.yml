# Repo-owned CI checks, called by the managed ci.yml inside the all-green gate: every job here must pass
# before all-green goes green, and a job added here is gated automatically.
#
# Two limits from running inside the `checks` caller: jobs get no secrets and are capped at the caller's
# permissions (contents: read), and all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more permissions, or must never be skippable
# belongs in its own workflow wired into the ruleset via .github/settings.yml.
#
# moon (moon.yml at the repo root) is the command interface; .github/actions/setup-moon provisions it and
# the pinned tools in every job. The rust matrix keeps the raw cargo verbs: the moon tasks wrap the same
# commands, and nextest is not on the bare runners.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # The CI image tag the Linux jobs run in (container-image.yml publishes :latest and :<input hash> from
  # main; the package must be public, since these jobs hold no packages:read). `latest` rather than the
  # hash: a PR that moves a pin would otherwise wait for an image that only its own merge can publish, and
  # inside the image `proto install` and rustup pick the moved pin up anyway. Empty runs every Linux job on
  # the bare runner, where setup-moon provisions the same toolchain.
  CI_IMAGE_TAG: latest

jobs:
  # The image's own user cannot write the runner-owned workspace, hence root.
  image:
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      container: ${{ steps.container.outputs.container }}
    steps:
      - id: container
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ -n "$CI_IMAGE_TAG" ]; then
            printf 'container={"image":"ghcr.io/%s-ci:%s","options":"--user root"}\n' "${REPOSITORY,,}" "$CI_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          fi

  # macOS compiles the cfg(target_os = "macos") enclave code and Windows the cfg(windows) loopback-TCP
  # code; neither is visible to the Linux build, which alone runs fmt (platform-independent) and the
  # fuzz-workspace check.
  rust:
    name: Rust (${{ matrix.os }})
    needs: image
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(matrix.container || '""') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ${{ needs.image.outputs.container }}
          - os: macos-14
          - os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
        with:
          rust: "true"
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz crate is excluded from the root workspace, so nothing above compiles it, and its targets
      # rotted unnoticed once (nightly-fuzz.yml is the only job that runs them). --locked because nothing
      # else exercises the fuzz workspace's own Cargo.lock.
      - if: runner.os == 'Linux'
        run: cargo check --locked --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets

  # Built once; the suites that drive the binary download it (.github/actions/release-binary).
  build-release:
    name: Release binary (Linux)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
        with:
          rust: "true"
      - run: moon run build-release
      - uses: ./.github/actions/release-binary
        with:
          mode: upload

  # Informational only: continue-on-error keeps a coverage-tooling failure from failing the all-green
  # aggregate, and there is no threshold. Gating comes later, deliberately, if the numbers prove stable.
  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
        with:
          rust: "true"
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --summary-only

  extension:
    name: Extension (typecheck, lint, format, test, build)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run typecheck check-ts shared:test extension:test
      - run: moon run extension:build
      # With build/extension/ present, check-extension-id also asserts the built manifest's security surface
      # (key, permissions, host access); the hygiene job runs it build-free for the source-level parity only.
      - run: moon run check-extension-id

  # The two checks that need BOTH toolchains: the generated TS must be exactly what the Rust emitters produce
  # today, and the hand-written layer over the generated wire validators must stay within the pinned parser
  # asymmetries. check-gen rewrites the generated modules, so it runs alone before the readers.
  contract:
    name: Contract (gen idempotency, envelope asymmetry gate)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
        with:
          rust: "true"
      - run: bun install --frozen-lockfile
      - run: moon run check-gen
      - run: moon run check-envelope check-gen-isolation

  # Every bun-side check that needs no build: version and extension-ID parity, the pin cross-checks, CJK
  # containment, the typography mirror of the managed ci.yml gate, the nightly drivers' tests, docs parity,
  # and the compose subset. check-docs-policy imports the settings schema, hence the install.
  hygiene:
    name: Repository hygiene (versions, pins, CJK, typography, docs parity, compose)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: >-
          moon run check-version check-extension-id check-toolchain check-hasher check-ignored
          check-cjk check-typography check-fuzz-smoke check-harness-driver
          check-docs-literals check-docs-policy check-compose

  # typos is not here: the managed ci.yml's standard-checks job runs the fleet's typos action over the same
  # _typos.toml (the local gate keeps its `moon run typos`).
  tooling:
    name: Tooling hygiene (cargo-machete)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
        with:
          rust: "true"
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          # The Containerfile reads this pin for the CI image; keep it in the `tool:` input of this step.
          tool: cargo-machete@0.9.2
      - run: moon run machete

  # Needs no toolchain, only the binary, so it stays on the bare runner.
  linux-install:
    name: Linux registration (doctor --fix / uninstall, isolated XDG directories)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - name: doctor --fix registers, re-registers, and uninstall reverses it (isolated HOME/XDG)
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" XDG_DATA_HOME="$tmp/data"
          bin="$PWD/target/release/chromium-bridge"
          mkdir -p "$tmp/home"
          "$bin" --help
          # Fresh machine, no browsers: --fix refuses instead of guessing.
          if "$bin" doctor --fix; then
            echo "doctor --fix should have failed with no browser detected" >&2; exit 1
          fi
          # Fake a detected Chrome; --fix picks exactly it up (fresh-machine install).
          mkdir -p "$tmp/config/google-chrome"
          "$bin" doctor --list
          "$bin" doctor --fix
          manifest="$tmp/config/google-chrome/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          test -f "$manifest"
          grep -q 'chrome-extension://mkjjlmjbcljpcfkfadfmhblmmddkdihf/' "$manifest"
          grep -q '"com.vivswan.chromium_bridge.host"' "$manifest"
          wrapper="$tmp/data/chromium-bridge/run-host-chrome.sh"
          test -x "$wrapper"
          grep -q -- '--native-host' "$wrapper"
          grep -q -- "--label 'chrome'" "$wrapper"
          # doctor --list reports the healthy registration.
          "$bin" doctor --list | grep -E 'chrome\s+detected\s+ok'
          # A wiped wrapper is diagnosed as stale, and --fix repairs it in place.
          rm "$wrapper"
          "$bin" doctor --list | grep -q 'stale'
          "$bin" doctor --fix
          test -x "$wrapper"
          # Explicit selection and the escape hatch.
          "$bin" doctor --fix --browser brave
          test -f "$tmp/config/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          "$bin" doctor --fix --manifest-dir "$tmp/custom/NativeMessagingHosts"
          test -f "$tmp/custom/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          # A manifest we did not write is refused and left byte-identical:
          # target it explicitly via --manifest-dir.
          mkdir -p "$tmp/foreign/NativeMessagingHosts"
          foreign="$tmp/foreign/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          echo '{"name":"com.other.host","description":"not ours"}' > "$foreign"
          if "$bin" doctor --fix --manifest-dir "$tmp/foreign/NativeMessagingHosts"; then
            echo "doctor --fix should have refused the foreign manifest" >&2; exit 1
          fi
          if "$bin" uninstall --manifest-dir "$tmp/foreign/NativeMessagingHosts"; then
            echo "uninstall should have failed on the foreign manifest" >&2; exit 1
          fi
          test -f "$foreign"
          grep -q 'com.other.host' "$foreign"
          # Everything we wrote is gone despite the failure on the foreign file.
          "$bin" uninstall --manifest-dir "$tmp/custom/NativeMessagingHosts"
          test ! -e "$manifest"
          test ! -e "$tmp/custom/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          test ! -e "$wrapper"
          test ! -e "$tmp/config/BraveSoftware/Brave-Browser/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          test ! -e "$tmp/data/chromium-bridge/run-host-brave.sh"
      - name: Explicit multi-browser selection, --all, and full uninstall
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export HOME="$tmp/home" XDG_CONFIG_HOME="$tmp/config" XDG_DATA_HOME="$tmp/data"
          bin="$PWD/target/release/chromium-bridge"
          mkdir -p "$tmp/home"
          # A comma-separated selection registers exactly those browsers,
          # detected or not; the unselected rows stay untouched.
          "$bin" doctor --fix --browser chrome,chromium,brave,edge
          for d in google-chrome chromium BraveSoftware/Brave-Browser microsoft-edge; do
            manifest="$tmp/config/$d/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
            test -f "$manifest"
            grep -q 'chrome-extension://mkjjlmjbcljpcfkfadfmhblmmddkdihf/' "$manifest"
          done
          for d in vivaldi opera; do
            test ! -e "$tmp/config/$d/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          done
          # --all covers every known browser; uninstall reverses every row,
          # wrappers included.
          "$bin" doctor --fix --all
          dirs="google-chrome chromium BraveSoftware/Brave-Browser microsoft-edge vivaldi opera"
          for d in $dirs; do
            test -f "$tmp/config/$d/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          done
          "$bin" uninstall
          for d in $dirs; do
            test ! -e "$tmp/config/$d/NativeMessagingHosts/com.vivswan.chromium_bridge.host.json"
          done
          for b in chrome chromium brave edge vivaldi opera; do
            test ! -e "$tmp/data/chromium-bridge/run-host-$b.sh"
          done

  # The suites hardcode target/release/chromium-bridge and build it only when missing, so the downloaded
  # binary is the one they drive. --upstream none skips the task's build-release dep (the artifact stands in
  # for it) and check-uv (a missing uv fails the run loudly anyway).
  protocol:
    name: Protocol suite (${{ matrix.suite }}, Python)
    needs: [image, build-release]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, adversarial, chaos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - env:
          SUITE: ${{ matrix.suite }}
        run: moon run "test-${SUITE}" --upstream none

  interop:
    name: MCP SDK v2 client interop (bun)
    needs: [image, build-release]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - run: bun install --frozen-lockfile
      # moon does not resolve runInCI:false tasks when CI=true, and test-interop, test-browser, and
      # harness-smoke keep that flag so affected-only `moon ci` runs never need the release binary or a
      # browser; CI invokes those suites' commands directly (here, browser.yml, nightly.yml).
      - run: bun test tests/interop/sdk-client.test.ts

  browser:
    name: Browser suites
    uses: ./.github/workflows/browser.yml
    with:
      chrome-version: stable

  # The public web app (src/apps/web) must keep building. Build-only here: the deploy is the managed ci.yml's
  # site leg, which runs .github/actions/site-build.
  web:
    name: web app builds
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # moon diffs against the PR base ref; a shallow clone lacks it
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run web:build web:test

  # The cargo deny pass gates merges: a new advisory lands as a red PR check, not a silent scheduled failure.
  # nightly.yml calls the same reusable workflow daily. A job calling a reusable workflow fails if any called
  # job fails, so this single job aggregates the audit legs for all-green.
  audits:
    name: Security audits
    uses: ./.github/workflows/audits.yml
