# Repo-owned CI checks, called by the managed ci.yml inside the all-green gate: every job here must pass
# before all-green goes green, and a job added here is gated automatically.
#
# Two limits from running inside the `checks` caller: jobs get no secrets and are capped at the caller's
# permissions (contents: read), and all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more permissions, or must never be skippable
# belongs in its own workflow wired into the ruleset via .github/settings.yml.
#
# moon (moon.yml at the repo root) is the command interface; .github/actions/setup-moon provisions it and
# the pinned tools in every job. The rust matrix keeps the raw cargo verbs: the moon tasks wrap the same
# commands, and nextest is not on the bare runners.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # The CI image tag the Linux jobs run in (container-image.yml publishes :latest and :<input hash> from
  # main; the package must be public, since these jobs hold no packages:read). `latest` rather than the
  # hash: a PR that moves a pin would otherwise wait for an image that only its own merge can publish, and
  # inside the image `proto install` and rustup pick the moved pin up anyway. The image job resolves the tag
  # to its digest once, so every job pins the same content. Empty runs every Linux job on the bare runner,
  # where setup-moon provisions the same toolchain.
  CI_IMAGE_TAG: latest

jobs:
  # The image's own user cannot write the runner-owned workspace, hence root. Every consumer carries a
  # zizmor unpinned-images ignore: the audit is static and cannot follow the expression to the digest
  # resolved here, which is the pin.
  image:
    name: CI image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      container: ${{ steps.container.outputs.container }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - id: container
        run: bun scripts/ci-image.ts digest

  # macOS compiles the cfg(target_os = "macos") enclave code and Windows the cfg(windows) named-pipe
  # code; neither is visible to the Linux build, which alone runs fmt (platform-independent) and the
  # fuzz-workspace check.
  rust:
    name: Rust (${{ matrix.os }})
    needs: image
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(matrix.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            container: ${{ needs.image.outputs.container }}
          - os: macos-14
          - os: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path src/packages/core/fuzz/Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The loom model check of the broker ref-count (core/moon.yml's test-loom). Platform-independent, like fmt.
      - if: runner.os == 'Linux'
        run: cargo test -p chromium-bridge-core --lib --features loom loom_model
      - if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The fuzz crate is excluded from the root workspace, so nothing above compiles or lints it, and
      # nightly-fuzz.yml is the only job that runs its targets (core/moon.yml's lint-fuzz).
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets -- -D warnings
      # The fuzz workspace's own tests (moon test-fuzz): every generated seed through its target
      # in-process, held to its reader's verdict. Stable rust, no libFuzzer.
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src/packages/core/fuzz/Cargo.toml

  # Built once; the suites that drive the binary download it (.github/actions/release-binary). On the bare
  # runner rather than in the image: a binary linked against the runner's older glibc runs inside the newer
  # image and on the runner alike, while the reverse direction is not guaranteed.
  build-release:
    name: Release binary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history on every job that runs moon: in a pull request, `moon run` diffs HEAD against GITHUB_BASE_REF
      # even without --affected, and that `git diff main HEAD` fails when `main` is unknown, as in a depth-1 checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: moon run build-release
      - uses: ./.github/actions/release-binary
        with:
          mode: upload

  # Informational only: continue-on-error keeps a coverage-tooling failure from failing the all-green
  # aggregate, and there is no threshold. Gating comes later, deliberately, if the numbers prove stable.
  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --summary-only

  extension:
    name: Extension (typecheck, lint, format, test, build)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run typecheck check-ts shared:test extension:test
      # Builds the extension through its dependency, then asserts the built manifest's security surface (key,
      # permissions, host access, the Chrome floor); the hygiene job runs the same task.
      - run: moon run check-extension-id

  # The two checks that need BOTH toolchains: the generated TS must be exactly what the Rust emitters produce
  # today, and the hand-written layer over the generated wire validators must stay within the pinned parser
  # asymmetries. check-gen rewrites the generated modules, so it runs alone before the readers.
  contract:
    name: Contract (gen idempotency, envelope asymmetry gate)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: bun install --frozen-lockfile
      # check-gen and check-gen-isolation spawn cargo with --frozen, which never fetches, so this job fetches the
      # crates first; a restored rust-cache may hold no registry.
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path src/packages/core/fuzz/Cargo.toml
      - run: moon run check-gen
      - run: moon run check-envelope check-gen-isolation check-refresh-lockfiles

  # Every bun-side check. moon.yml's `hygiene` task owns the list (the `ci` gate depends on the same task), so a
  # check added there runs here without a change to this file. check-docs-policy imports the settings schema and
  # check-extension-id builds the extension, hence the install.
  hygiene:
    name: Repository hygiene (versions, pins, CJK, typography, docs parity, compose)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run hygiene

  # typos is not here: the managed ci.yml's standard-checks job runs the fleet's typos action over the same
  # _typos.toml (the local gate keeps its `moon run typos`).
  tooling:
    name: Tooling hygiene (cargo-machete)
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      # The Containerfile owns the pin (ARG CARGO_MACHETE_VERSION); the image already carries that version,
      # and the bare runner installs the same one.
      - id: pin
        run: bun scripts/pin.ts cargo-machete --output machete
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-machete@${{ steps.pin.outputs.machete }}
      - run: moon run machete

  # Needs no toolchain, only the binary and a bun for the scenario driver (scripts/linux-registration.ts
  # imports nothing installed), so it stays on the bare runner.
  linux-install:
    name: Linux registration (doctor --fix / uninstall, isolated XDG directories)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: doctor --fix registers, re-registers, and uninstall reverses it (isolated HOME/XDG)
        run: bun scripts/linux-registration.ts fresh-machine
      - name: Explicit multi-browser selection, --all, and full uninstall
        run: bun scripts/linux-registration.ts multi-browser

  # The suites hardcode target/release/chromium-bridge and build it only when missing, so the downloaded
  # binary is the one they drive. --upstream none skips the task's build-release dep (the artifact stands in
  # for it) and check-uv (a missing uv fails the run loudly anyway).
  protocol:
    name: Protocol suite (${{ matrix.suite }}, Python)
    needs: [image, build-release]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, adversarial, chaos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - env:
          SUITE: ${{ matrix.suite }}
        run: moon run "test-${SUITE}" --upstream none

  interop:
    name: MCP SDK v2 client interop (bun)
    needs: [image, build-release]
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - run: bun install --frozen-lockfile
      # moon does not resolve runInCI:false tasks when CI=true, and test-interop, test-browser, and
      # harness-smoke keep that flag so affected-only `moon ci` runs never need the release binary or a
      # browser; CI invokes those suites' commands directly (here, browser.yml, nightly.yml).
      - run: bun test tests/interop/sdk-client.test.ts

  browser:
    name: Browser suites
    uses: ./.github/workflows/browser.yml
    with:
      chrome-version: stable

  # On every PR: the managed all-green aggregate allows a skip of `checks` alone, so a path-filtered skip
  # here would fail it.
  installers:
    name: Installers
    uses: ./.github/workflows/installers.yml
    permissions:
      contents: read

  # The public web app (src/apps/web) must keep building. Build-only here: the deploy is the managed ci.yml's
  # site leg, which runs .github/actions/site-build.
  web:
    name: web app builds
    needs: image
    runs-on: ubuntu-latest
    container: ${{ fromJSON(needs.image.outputs.container || '""') }} # zizmor: ignore[unpinned-images]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run web:build web:test

  # The cargo deny pass gates merges: a new advisory lands as a red PR check, not a silent scheduled failure.
  # nightly.yml calls the same reusable workflow daily. A job calling a reusable workflow fails if any called
  # job fails, so this single job aggregates the audit legs for all-green.
  audits:
    name: Security audits
    uses: ./.github/workflows/audits.yml
