# Repo-owned CI checks, called by the managed ci.yml inside the all-green gate: every job here must pass
# before all-green goes green, and a job added here is gated automatically.
#
# Two limits from running inside the `checks` caller: jobs get no secrets and are capped at the caller's
# permissions (contents: read), and all-green only sees the aggregate result, so a job skipped by its own
# `if:` does not fail the gate. A check that needs secrets, more permissions, or must never be skippable
# belongs in its own workflow wired into the ruleset via .github/settings.yml.
#
# Every job runs on a GitHub-hosted runner, already isolated, so the Containerfile (the developer's isolated
# environment) is never CI's. .github/actions/setup-moon provisions moon and the pinned tools on each runner.
#
# Full history (fetch-depth: 0) on every job that runs moon: in a pull request, `moon run` diffs HEAD against
# GITHUB_BASE_REF even without --affected, and that `git diff main HEAD` fails when `main` is unknown, as in
# a depth-1 checkout.

name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  # macOS compiles the cfg(target_os = "macos") enclave code and Windows the cfg(windows) named-pipe code;
  # neither is visible to the Linux build, which alone runs the platform-independent steps (fmt, the loom
  # model, rustdoc) and the fuzz workspace, which the root workspace excludes so nothing else compiles or
  # lints it. Raw cargo verbs rather than the moon tasks: those wrap nextest, which is not on the runners.
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - if: runner.os == 'Linux'
        run: cargo fmt --check
      - if: runner.os == 'Linux'
        run: cargo fmt --check --manifest-path src/packages/core/fuzz/Cargo.toml
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - if: runner.os == 'Linux'
        run: cargo test -p chromium-bridge-core --lib --features loom loom_model
      - if: runner.os == 'Linux'
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - if: runner.os == 'Linux'
        run: cargo clippy --locked --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets -- -D warnings
      - if: runner.os == 'Linux'
        run: cargo test --locked --manifest-path src/packages/core/fuzz/Cargo.toml

  # Built once; the suites that drive the binary download it (.github/actions/release-binary).
  build-release:
    name: Release binary (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: moon run build-release
      - uses: ./.github/actions/release-binary
        with:
          mode: upload

  # Informational only: continue-on-error keeps a coverage-tooling failure from failing the all-green
  # aggregate, and there is no threshold. Gating comes later, deliberately, if the numbers prove stable.
  coverage:
    name: Coverage (cargo-llvm-cov, informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov
      - run: cargo llvm-cov --summary-only

  # The gate's bun-side tasks, one runner per row. moon.yml owns what each task does; the first two rows
  # select theirs here, and a check added to the `hygiene` aggregate runs without a change to this file.
  moon:
    name: moon run ${{ matrix.tasks }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        tasks:
          - typecheck check-ts shared:test extension:test check-extension-id
          - check-envelope check-gen-isolation check-refresh-lockfiles
          - hygiene
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - uses: ./.github/actions/workspace-deps
      - run: moon run ${{ matrix.tasks }}

  # typos is not here: the managed ci.yml's standard-checks job runs the fleet's typos action over the same
  # _typos.toml (the local gate keeps its `moon run typos`).
  tooling:
    name: Tooling hygiene (cargo-machete)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - id: pin
        run: bun scripts/pin.ts cargo-machete --output machete
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-machete@${{ steps.pin.outputs.machete }}
      - run: moon run machete

  # The scenario driver reads the host id and extension id from the generated identity module, hence
  # gen-shared before it runs.
  linux-install:
    name: Linux registration (doctor --fix / uninstall, isolated XDG directories)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - uses: ./.github/actions/workspace-deps
      - run: moon run gen-shared
      - name: doctor --fix registers, re-registers, and uninstall reverses it (isolated HOME/XDG)
        run: bun scripts/linux-registration.ts fresh-machine
      - name: Explicit multi-browser selection, --all, and full uninstall
        run: bun scripts/linux-registration.ts multi-browser

  # The suites hardcode target/release/chromium-bridge and build it only when missing, so the downloaded
  # binary is the one they drive. --upstream none skips the task's build-release dep (the artifact stands in
  # for it) and check-uv (a missing uv fails the run loudly anyway).
  protocol:
    name: Protocol suite (${{ matrix.suite }}, Python)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [e2e, adversarial, chaos]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - run: moon run test-${{ matrix.suite }} --upstream none

  # moon does not resolve runInCI:false tasks when CI=true, and test-interop, test-browser, and harness-smoke
  # keep that flag so affected-only `moon ci` runs never need the release binary or a browser; CI invokes
  # those suites' commands directly (here, browser.yml, nightly.yml).
  interop:
    name: MCP SDK v2 client interop (bun)
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
      - uses: ./.github/actions/release-binary
        with:
          mode: download
      - run: bun install --frozen-lockfile
      - run: bun test tests/interop/sdk-client.test.ts

  browser:
    name: Browser suites
    uses: ./.github/workflows/browser.yml
    with:
      chrome-version: stable

  # On every PR: the managed all-green aggregate allows a skip of `checks` alone, so a path-filtered skip
  # here would fail it.
  installers:
    name: Installers
    uses: ./.github/workflows/installers.yml
    permissions:
      contents: read

  # Build-only: the deploy is the managed ci.yml's site leg, which runs .github/actions/site-build and
  # renders docs/ beside it.
  web:
    name: web app builds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
      - run: bun install --frozen-lockfile
      - run: moon run web:build

  # The cargo deny pass gates merges: a new advisory lands as a red PR check, not a silent scheduled failure.
  # nightly.yml calls the same reusable workflow daily. A job calling a reusable workflow fails if any called
  # job fails, so this single job aggregates the audit legs for all-green.
  audits:
    name: Security audits
    uses: ./.github/workflows/audits.yml
