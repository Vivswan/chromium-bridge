# The same .pkg, .deb and .msi update-release.yml builds at release time, proved before one.

name: Installers

on:
  workflow_call:

permissions: {}

jobs:
  installer:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        # The same three legs as update-release.yml's binaries job.
        include:
          - os: macos-14
            platform: macos
            arch: arm64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: windows-2022
            platform: windows
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      # Full history on a job that runs moon: on a pull request moon's changed-files query reads the base branch,
      # which a depth-1 checkout lacks.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"

      - name: Build the release binary
        run: cargo build --release --locked --package chromium-bridge

      - id: pin
        if: matrix.platform == 'linux'
        run: bun scripts/pin.ts cargo-deb --output deb
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        if: matrix.platform == 'linux'
        with:
          tool: cargo-deb@${{ steps.pin.outputs.deb }}

      - name: Package installer
        id: installer
        run: bun scripts/release-package.ts installer-from-cargo

      # The smoke driver reads the host id and extension id from the generated identity module, a build output
      # of the gen tasks (their cargo runs take --frozen, which never fetches, so the crates are fetched first).
      - run: bun install --frozen-lockfile
      - run: |
          cargo fetch --locked
          cargo fetch --locked --manifest-path src/packages/core/fuzz/Cargo.toml
      - run: moon run gen-shared

      - name: Install, drive the installed binary, uninstall
        env:
          INSTALLER: ${{ steps.installer.outputs.installer }}
        run: bun scripts/installer-smoke.ts

      # For a human to try by hand on a machine of that platform.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.installer.outputs.installer }}
          path: |
            ${{ steps.installer.outputs.installer }}
            ${{ steps.installer.outputs.installersha256file }}
          if-no-files-found: error
          retention-days: 7
