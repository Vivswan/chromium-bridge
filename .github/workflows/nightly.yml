name: Nightly browser and mutation tests

# Runs the browser DOM + smoke tests against a freshly installed, CI-isolated
# Chrome, plus a full cargo-mutants pass, on a schedule so we catch
# regressions without gating PRs (nightly fuzzing has its own workflow,
# nightly-fuzz.yml). The browser job mirrors the `browser` job in ci.yml
# (same pinned action SHAs, same steps) but is triggered by cron / manual
# dispatch instead of on push/PR.
#
# The report job is this repository's instance of repo-platform's
# nightly-module machinery (docs/nightly.md over there): a red night files
# or updates one label-deduplicated tracking issue (nightly-failure -
# distinct from the fuzz stream's fuzz-nightly, a shared label would let
# one stream's green night close the other's issue), a green night closes
# it. This file is repo-owned - template sync never updates it - so a
# breaking change to the fuzz-issue action's inputs needs a manual edit here.
#
# It uses browser-actions/setup-chrome to install an isolated Chrome into the
# runner and points CHROME_BIN at it - it never touches a developer's own
# browser or any machine outside the ephemeral CI runner.

on:
  schedule:
    # 05:17 UTC daily (off the top of the hour to avoid the scheduler rush).
    - cron: "17 5 * * *"
  workflow_dispatch:

# Never run two nightly passes at once - the group is constant, not
# per-ref, because the tracking issue is repository-global and overlapping
# runs from different refs would race its dedup. No cancel-in-progress:
# `if: always()` jobs still run in a cancelled run, so cancelling a
# superseded pass would make its report job file a spurious failure issue;
# a newer run queues behind the in-flight one instead.
concurrency:
  group: nightly
  cancel-in-progress: false

# The check jobs need only the checkout; the report job scopes its own
# issue and dispatch permissions below.
permissions:
  contents: read

jobs:
  browser:
    name: DOM + smoke (Chrome, scheduled)
    runs-on: ubuntu-latest
    # A hang becomes a CANCELLED job at this bound, which the report job
    # counts as red - without it a wedged browser test sits on GitHub's
    # 6-hour default before anything is filed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2.1.2
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run --cwd src/apps/extension build
      - name: Typecheck tests
        run: bun run --cwd tests/browser typecheck
      - name: DOM-layer tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bun tests/browser/dom_test.ts
      - name: Extension smoke test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        # The smoke test needs a non-headless browser (MV3 SW reliability), so
        # give it a virtual display. xvfb ships on GitHub's ubuntu runners.
        run: xvfb-run -a bun tests/browser/ext_test.ts

  # Mutation testing lives here rather than in the PR gate because a full
  # cargo-mutants pass is far too slow for every PR. Missed mutants (exit 2)
  # and mutant timeouts (exit 3) are reported, not fatal: they measure test
  # quality and get fixed deliberately, whereas a baseline build/test failure
  # is a real break.
  mutants:
    name: Mutation testing (cargo-mutants, scheduled)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2
        with:
          tool: cargo-mutants
      - name: cargo mutants (missed mutants and timeouts reported, not fatal)
        run: |
          rc=0
          cargo mutants --no-shuffle || rc=$?
          echo "== outcome summary =="
          for f in missed timeout unviable; do
            if [ -s "mutants.out/$f.txt" ]; then
              echo "-- $f --"
              cat "mutants.out/$f.txt"
            fi
          done
          # Exit 2 (missed mutants) and exit 3 (mutant timeouts) both mean a
          # mutant survived the test suite: informational here. Anything else
          # (baseline build/test failure, usage error) is real.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

  # Runs whatever happened to the check jobs, and treats a CANCELLED job as
  # red: a job that hits its timeout is cancelled, not failed, and a hang is
  # exactly what a nightly run exists to catch. Neither red nor green matches
  # 'skipped', so the check jobs must stay unconditional - a skipped sibling
  # would make this job silently do nothing that night.
  report:
    needs: [browser, mutants]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls; a hung reporter is the residual silence window, so
    # keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue;
    # actions: write lets the red path dispatch auto-assign at it.
    permissions:
      issues: write
      actions: write
    steps:
      - name: File or update the nightly issue
        id: file-issue
        if: contains(fromJSON('["failure", "cancelled"]'), needs.browser.result) || contains(fromJSON('["failure", "cancelled"]'), needs.mutants.result)
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: report
          label: nightly-failure
          title: Nightly CI failures
          # No artifacts directory is passed: this stream files the generic
          # nightly-failure report (workflow, commit, run link) rather than
          # the fuzzer's failure-report contract. The tuple below is used
          # only when the label has to be created and matches the
          # settings.yml declaration.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure

      # A GITHUB_TOKEN-created issue fires no triggers, so dispatch auto-assign.
      - name: Trigger auto-assign for the filed issue
        if: steps.file-issue.outputs.issue-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.file-issue.outputs.issue-number }}
        run: gh workflow run auto-assign.yml -f "issue=$ISSUE_NUMBER" || echo "::warning::could not dispatch auto-assign.yml"

      - name: Close the nightly issue on a green night
        if: needs.browser.result == 'success' && needs.mutants.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@main
        with:
          mode: resolve
          label: nightly-failure
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic
