name: Nightly browser and mutation tests

# Scheduled, never PR-gating: the full cargo-mutants pass is too slow for PRs, and the daily DOM + smoke rerun
# against that day's Chrome `stable` surfaces a Chrome release that breaks them on a day with no PR.
#
#   browser job   -> the PR job's subset (checks.yml `browser`, inside all-green): same pinned action SHAs and
#                    DOM + smoke steps, without the security proofs and the RAN-marker canary
#   setup-chrome  -> installs Chrome into the ephemeral runner (CHROME_BIN), never a developer's own browser
#   fuzzing       -> nightly-fuzz.yml
#
# The report job is the fleet's nightly module (repo-platform docs/nightly.md): one label-deduplicated issue.
#   red night    -> files or updates the `nightly-failure` issue
#   green night  -> closes it
#   fuzz stream  -> its own label, fuzz-nightly; a shared label would let one stream's green close the other's issue
# Repo-owned, so a sync never updates it: a breaking change to the fuzz-issue action's inputs is a manual edit here.

on:
  schedule:
    # 05:17 UTC daily (off the top of the hour to avoid the scheduler rush).
    - cron: "17 5 * * *"
  workflow_dispatch:

# Never run two nightly passes at once - the group is constant, not
# per-ref, because the tracking issue is repository-global and overlapping
# runs from different refs would race its dedup. No cancel-in-progress:
# `if: always()` jobs still run in a cancelled run, so cancelling a
# superseded pass would make its report job file a spurious failure issue;
# a newer run queues behind the in-flight one instead.
concurrency:
  group: nightly
  cancel-in-progress: false

# The check jobs need only the checkout; the report job scopes its own
# issue permission below.
permissions:
  contents: read

jobs:
  browser:
    name: DOM + smoke (Chrome, scheduled)
    runs-on: ubuntu-latest
    # A hang becomes a CANCELLED job at this bound, which the report job
    # counts as red - without it a wedged browser test sits on GitHub's
    # 6-hour default before anything is filed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - run: bun install --frozen-lockfile
      - run: bun run --cwd src/apps/extension build
      - name: Typecheck tests
        run: bun run --cwd tests/browser typecheck
      - name: DOM-layer tests
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        run: bun tests/browser/dom_test.ts
      - name: Extension smoke test
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
        # The smoke test needs a non-headless browser (MV3 SW reliability), so
        # give it a virtual display. xvfb ships on GitHub's ubuntu runners.
        run: xvfb-run -a bun tests/browser/ext_test.ts

  # Missed mutants (exit 2) and mutant timeouts (exit 3) are reported, not fatal: they measure test quality
  # and get fixed deliberately, whereas a baseline build/test failure is a real break.
  #
  # Sharded because the serial pass outgrew the job timeout. Each shard lists every mutant and tests its slice, so:
  #   every argument but the shard index  -> identical across shards
  #   --no-shuffle                        -> the same assignment in every independent job
  #   fail-fast off                       -> a cancelled sibling would read as a hang in the report job's aggregate
  mutants:
    name: Mutation testing (cargo-mutants, scheduled, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          cache: false
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2.87.5
        with:
          tool: cargo-mutants
      - name: cargo mutants (missed mutants and timeouts reported, not fatal)
        run: |
          rc=0
          cargo mutants --no-shuffle --shard "${{ matrix.shard }}/${{ strategy.job-total }}" || rc=$?
          echo "== outcome summary =="
          for f in missed timeout unviable; do
            if [ -s "mutants.out/$f.txt" ]; then
              echo "-- $f --"
              cat "mutants.out/$f.txt"
            fi
          done
          # Exit 2 (missed mutants) and exit 3 (mutant timeouts) both mean a
          # mutant survived the test suite: informational here. Anything else
          # (baseline build/test failure, usage error) is real.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ] && [ "$rc" -ne 3 ]; then
            exit "$rc"
          fi

  # Runs whatever happened to the check jobs, and treats a CANCELLED job as
  # red: a job that hits its timeout is cancelled, not failed, and a hang is
  # exactly what a nightly run exists to catch. Neither red nor green matches
  # 'skipped', so the check jobs must stay unconditional - a skipped sibling
  # would make this job silently do nothing that night.
  report:
    needs: [browser, mutants]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls; a hung reporter is the residual silence window, so
    # keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue
    # (it assigns the owner at creation; auto-assign sweeps nightly).
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        id: file-issue
        if: contains(fromJSON('["failure", "cancelled"]'), needs.browser.result) || contains(fromJSON('["failure", "cancelled"]'), needs.mutants.result)
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: report
          label: nightly-failure
          title: Nightly CI failures
          # No artifacts directory: this stream files the generic report (workflow, commit, run link), not
          # the fuzzer's failure-report contract. Color and description apply only when the label is created.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure

      - name: Close the nightly issue on a green night
        if: needs.browser.result == 'success' && needs.mutants.result == 'success'
        uses: Vivswan/repo-platform/actions/fuzz-issue@build
        with:
          mode: resolve
          label: nightly-failure
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic
