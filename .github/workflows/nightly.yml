name: Nightly checks

# Scheduled, never PR-gating: everything here is too slow for a PR, depends on the outside world, or reruns
# a PR-time check against that day's world so a quiet repository still learns about a break.
#
#   browser        -> the PR job's suites (browser.yml, the one definition), against that day's Chrome `stable`
#   mutants        -> the full cargo-mutants pass, sharded
#   harness-smoke  -> real agent-harness CLIs (Claude Code, Codex) at their CURRENT releases connect to our
#                     stdio MCP server; frames are captured and the opening method logged (the canary for
#                     retiring the legacy-initialize shim)
#   audits         -> the same cargo deny pass that gates every merge (checks.yml -> audits.yml), rerun daily
#                     so an advisory disclosed between pushes surfaces here instead of at the next PR
#   setup-chrome   -> installs Chrome into the ephemeral runner (CHROME_BIN), never a developer's own browser
#   fuzzing        -> nightly-fuzz.yml
#
# The report job is the fleet's nightly module (repo-platform docs/nightly.md): one label-deduplicated issue.
#   red night    -> files or updates the `nightly-failure` issue
#   green night  -> closes it
#   fuzz stream  -> its own label, fuzz-nightly; a shared label would let one stream's green close the other's issue
# Repo-owned, so a sync never updates it: a breaking change to the fuzz-issue action's inputs is a manual edit here.

on:
  schedule:
    # 05:17 UTC daily (off the top of the hour to avoid the scheduler rush).
    - cron: "17 5 * * *"
  workflow_dispatch:

# Never run two nightly passes at once - the group is constant, not
# per-ref, because the tracking issue is repository-global and overlapping
# runs from different refs would race its dedup. No cancel-in-progress:
# `if: always()` jobs still run in a cancelled run, so cancelling a
# superseded pass would make its report job file a spurious failure issue;
# a newer run queues behind the in-flight one instead.
concurrency:
  group: nightly
  cancel-in-progress: false

# The check jobs need only the checkout; the report job scopes its own
# issue permission below.
permissions:
  contents: read

jobs:
  browser:
    name: Browser suites (Chrome stable, scheduled)
    uses: ./.github/workflows/browser.yml
    with:
      chrome-version: stable

  # Missed mutants (exit 2) and mutant timeouts (exit 3) are reported, not fatal: they measure test quality
  # and get fixed deliberately, whereas a baseline build/test failure is a real break.
  #
  # Sharded because the serial pass outgrew the job timeout. Each shard lists every mutant and tests its slice, so:
  #   every argument but the shard index  -> identical across shards
  #   --no-shuffle                        -> the same assignment in every independent job
  #   fail-fast off                       -> a cancelled sibling would read as a hang in the report job's aggregate
  mutants:
    name: Mutation testing (cargo-mutants, scheduled, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-mutants
      - name: cargo mutants (missed mutants and timeouts reported, not fatal)
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: bun scripts/mutants-shard.ts

  # The captured frames (uploaded green or red) are the run's real output: `--mint-seeds <dir>` turns them into
  # mcp_jsonrpc fuzz seeds outside the repo. The registry's *-live-fakellm entries additionally drive a full
  # model-driven tool call per CLI against a local fake LLM backend (tests/harness/fake-llm.ts), so the
  # whole run needs no secrets.
  #
  # The driver is invoked directly (like nightly-fuzz.yml invokes fuzz-smoke.ts): the harness-smoke moon
  # task is runInCI:false, which moon does not resolve at all when CI=true - the same reason checks.yml's
  # browser job calls its suites directly.
  harness-smoke:
    name: Agent-harness interop smoke (current CLI releases)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-moon
        with:
          cargo: "true"
      - run: cargo build --release
      # Latest on purpose, not pinned: the whole point of this canary is to
      # observe what CURRENT harness releases send. Best-effort: a harness
      # whose install fails is skipped by the driver (continue-on-error marks
      # the step, not the job); --require-any below keeps an install-failed
      # (or config-entry-only) run from reading green.
      - name: Install Claude Code (best-effort, deliberately unpinned)
        continue-on-error: true
        run: npm install -g @anthropic-ai/claude-code
      - name: Install Codex (best-effort, deliberately unpinned)
        continue-on-error: true
        run: npm install -g @openai/codex
      # setup-moon puts proto's npm first on PATH, and that npm installs into proto's node prefix, whose
      # bin directory is not on PATH; the driver resolves the CLIs by walking PATH alone.
      - name: Put the global npm bin directory on PATH
        run: echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"
      - name: Harness smoke (fails unless a harness completes a live MCP connection)
        run: bun tests/harness/run.ts --require-any
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: harness-captures-${{ github.run_attempt }}
          path: build/harness-captures/
          if-no-files-found: warn

  # A job calling a reusable workflow fails if any called job fails, so this
  # one job aggregates the audit legs for the report below.
  audits:
    name: Supply-chain audits (scheduled)
    uses: ./.github/workflows/audits.yml

  # Runs whatever happened to the check jobs, and treats a CANCELLED job as
  # red: a job that hits its timeout is cancelled, not failed, and a hang is
  # exactly what a nightly run exists to catch. Both conditions read every
  # entry of `needs`, so a sibling added to the list is folded in by itself.
  # Neither red nor green matches 'skipped', so the check jobs must stay
  # unconditional - a skipped sibling would make this job silently do
  # nothing that night.
  report:
    needs: [browser, mutants, harness-smoke, audits]
    if: always()
    runs-on: ubuntu-latest
    # A few gh calls; a hung reporter is the residual silence window, so
    # keep this tight.
    timeout-minutes: 5
    # issues: write lets the fuzz-issue action file/close the tracking issue
    # (it assigns the owner at creation; auto-assign sweeps nightly).
    permissions:
      issues: write
    steps:
      - name: File or update the nightly issue
        id: file-issue
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: report
          label: nightly-failure
          title: Nightly CI failures
          # No artifacts directory: this stream files the generic report (workflow, commit, run link), not
          # the fuzzer's failure-report contract. Color and description apply only when the label is created.
          label-color: "D93F0B"
          label-description: Automated nightly CI failure
          stream: generic

      - name: Close the nightly issue on a green night
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && !contains(needs.*.result, 'skipped') }}
        uses: Vivswan/repo-platform/actions/fuzz-issue@stable
        with:
          mode: resolve
          label: nightly-failure
          # The generic close wording; without it the action keeps the fuzz
          # stream's regression-seed hedging.
          stream: generic
