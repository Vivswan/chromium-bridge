# Publishes the CI image a pull request built, from main's own definition: a workflow_run workflow runs
# the YAML on the default branch, whatever the pull request's copy says.
#
# Trust boundary. The YAML a pull request controls on this publish path holds no package token
# (container-image.yml's build job pushes nothing). Nothing a pull request produced is pushed: this job
# rebuilds, before any login, from a context it writes itself out of the merge commit's blobs, exactly
# the files the content tag hashes. The trusted builder recomputes everything with main's scripts:
# eligibility, the merge commit's parentage against the run's head, the content tag and proto pin, and
# whether the tag is still free (a content tag never moves; :latest moves from main alone).

name: Container image (publish for a pull request)

on:
  workflow_run:
    workflows: [Container image]
    types: [completed]

permissions:
  contents: read
  packages: write

# One lane per pull request head: a shared lane keeps one pending run and would cancel another pull
# request's publish; two heads publish different tags, and the same inputs under two heads push the same
# tag twice, which is harmless.
concurrency:
  group: container-image-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Rebuild the pull request's image and push its content tag
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Main's checkout: the scripts below are main's, never the pull request's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true
      - run: bun install --frozen-lockfile
      - id: eligible
        env:
          PUBLISH_EVENT: ${{ github.event.workflow_run.event }}
          PUBLISH_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: bun scripts/ci-image.ts eligible
      - if: steps.eligible.outputs.eligible == 'true'
        name: The pull request's merge commit, refused unless it merges the run's head
        env:
          CI_IMAGE_ROOT: pull-request
          CI_IMAGE_CONTEXT: pull-request-context
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          PR_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: bun scripts/ci-image.ts merge-checkout
      # From the materialized context, so the tag names exactly what the build below can read.
      - if: steps.eligible.outputs.eligible == 'true'
        id: image
        env:
          CI_IMAGE_ROOT: pull-request-context
        run: bun scripts/ci-image.ts coordinates
      - if: steps.eligible.outputs.eligible == 'true'
        id: free
        env:
          CI_IMAGE_CONTENT_TAG: ${{ steps.image.outputs.tag }}
        run: bun scripts/ci-image.ts unpublished
      - if: steps.free.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Main's cache is read, never written from a pull request's build.
      - if: steps.free.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: pull-request-context
          file: pull-request-context/Containerfile
          platforms: linux/amd64
          push: false
          load: true
          build-args: PROTO_VERSION=${{ steps.image.outputs.proto }}
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha
      - if: steps.free.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.free.outputs.publish == 'true'
        env:
          REFERENCE: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
        run: docker push "$REFERENCE"
