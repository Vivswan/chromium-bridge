# The release binary is built once per run (checks.yml build-release) and handed to the jobs that drive it
# as a run artifact. An artifact loses the executable bit, so the download restores it.
name: Release binary
description: Uploads the Linux release binary as a run artifact, or downloads it into target/release.

inputs:
  mode:
    description: upload (after the build) or download (before a suite that drives the binary).
    required: true

runs:
  using: composite
  steps:
    - if: inputs.mode != 'upload' && inputs.mode != 'download'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error::release-binary mode must be upload or download, got '$MODE'"
        exit 1
    - if: inputs.mode == 'upload'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: chromium-bridge-linux
        path: target/release/chromium-bridge
        if-no-files-found: error
        retention-days: 1
    - if: inputs.mode == 'download'
      uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
      with:
        name: chromium-bridge-linux
        path: target/release
    - if: inputs.mode == 'download'
      shell: bash
      run: chmod +x target/release/chromium-bridge
