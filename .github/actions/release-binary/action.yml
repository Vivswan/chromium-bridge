# The release binary is built once per run (checks.yml build-release) and handed to the jobs that drive it
# as a run artifact. An artifact loses the executable bit, so the download restores it.
name: Release binary
description: |
  Carries the Linux release binary between the jobs of one run as an artifact.

  Both modes use target/release/genkan, and the download restores the executable bit.

  The caller's obligations:
    - upload from a Linux job that built target/release/genkan first
    - download only in a job that needs the uploading job, since an absent artifact fails the step
    - download after setup-moon: on a partial cache hit rust-cache prunes target/release to its dependency artifacts, which deletes a binary placed there earlier
    - use the artifact within the run, as it is retained for one day

inputs:
  mode:
    description: upload after the build, or download before a suite that drives the binary.
    required: true

runs:
  using: composite
  steps:
    - if: inputs.mode != 'upload' && inputs.mode != 'download'
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
      run: |
        echo "::error::release-binary mode must be upload or download, got '$MODE'"
        exit 1
    - if: inputs.mode == 'upload'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: genkan-linux
        path: target/release/genkan
        if-no-files-found: error
        retention-days: 1
    - if: inputs.mode == 'download'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: genkan-linux
        path: target/release
    - if: inputs.mode == 'download'
      shell: bash
      run: chmod +x target/release/genkan
