# proto's own version is the one pin moonrepo/setup-toolchain cannot read from .prototools (it looks in
# .moon/toolchains.yml), so scripts/pin.ts supplies it, which needs a bun first: setup-bun installs the
# .bun-version one, and proto then installs the .prototools one on top (two bun installs, by design).
# rust is rustup's alone: proto's rust plugin registers a toolchain without a rustc, which makes
# setup-rust-toolchain believe rust-toolchain.toml is already installed.
name: Set up moon
description: |
  Installs proto, moon, and every tool .prototools pins on the runner. The step order lives in docs/development.md, "Toolchain pinning".

  With cargo set to "true" it also installs rust from rust-toolchain.toml through rustup and restores the cargo cache for both cargo workspaces.

  After it, proto's shims are on PATH, so later steps call moon, bun, and the other pinned tools directly.

  The caller's obligations:
    - check out the repository first, since the pin files and scripts/pin.ts are read from it
    - install the repository's pinned rust through the cargo input, never through proto (a job that wants another toolchain installs it itself afterwards)
    - grant no extra permissions, since the installs and the caches need none beyond the job's own token

inputs:
  cargo:
    description: Also install rust from rust-toolchain.toml and restore the cargo cache ("false" skips both).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
        # Nothing worth caching runs under this bun (proto's own bun does the installs), and a publishing
        # caller must not restore a cache into what it ships.
        no-cache: true
    - id: pin
      shell: bash
      run: bun scripts/pin.ts proto --output proto
    - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
      with:
        proto-version: ${{ steps.pin.outputs.proto }}
        auto-install: "true"
    - if: inputs.cargo == 'true'
      uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      with:
        cache: false
    - if: inputs.cargo == 'true'
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # The fuzz crate is its own cargo workspace with its own target/ (root [workspace].exclude).
        workspaces: |
          .
          src/packages/core/fuzz
