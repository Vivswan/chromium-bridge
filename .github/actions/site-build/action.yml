# The repo-owned website hook of the fleet's site leg (reusable-site.yml runs
# it inside the deploy job and publishes the `dist` directory at the site
# root). The Astro landing page reads the two inputs as ASTRO_BASE and
# ASTRO_SITE (src/apps/web/src/lib/site-identity.ts); the docs are the leg's
# own render of docs/ and its locale trees, mounted beside this build.
name: Build the website
description: |
  Builds the Astro site in src/apps/web for the fleet's site leg and names the directory to publish.

  The caller's obligations:
    - check out the repository first
    - pass base-path and origin exactly as the site is served, which the fleet's reusable-site.yml supplies
    - publish the dist output directory at the site root

inputs:
  base-path:
    description: The URL path the site is served under, /<repo>/ or / with a custom domain.
    required: true
  origin:
    description: The site origin, such as https://<owner>.github.io or https://<domain>.
    required: true

outputs:
  dist:
    description: The built site directory, relative to the repository root.
    value: ${{ steps.build.outputs.dist }}

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version-file: .bun-version
    - run: bun install --frozen-lockfile
      shell: bash
    - id: build
      shell: bash
      env:
        ASTRO_BASE: ${{ inputs.base-path }}
        ASTRO_SITE: ${{ inputs.origin }}
      run: |
        bun run --cwd src/apps/web build
        echo "dist=build/web" >> "$GITHUB_OUTPUT"
