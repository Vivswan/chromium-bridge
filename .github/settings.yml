---
# This repository's OWN settings, applied by Vivswan/repo-platform
# (and by settings-sync on pushes to this file when the repo carries its
# own REPO_PLATFORM_TOKEN). Rendered once, repo-owned: template sync never
# rewrites it. Fleet defaults merge UNDER this file - keys here win, null
# opts out, labels replace by name, rulesets MERGE by name; both must stay
# lists. The fleet invariants (squash-only merging, the protection
# rulesets) sit ABOVE and cannot be overridden. Undeclared labels are
# deleted by the apply; undeclared rulesets are left alone.

repository:
  description: "Authenticated MCP bridge to your real Chromium browsers (Brave, Chrome): Rust native-messaging host + MV3 extension, no debug port"
  # Declared even when empty: the apply manages only declared keys, so
  # this keeps it healing out-of-band edits.
  homepage: ""
  topics: "brave,browser-automation,chrome-extension,mcp,native-messaging,rust"
  private: false

# This repository's own labels (the fleet layers already carry the
# dependabot, release, and tracking labels its modules need):
# labels:
#   - name: my-label
#     color: "0e8a16"
#     description: What it marks

# This repository's own rulesets, or additions to a fleet one (an entry
# named like a fleet ruleset merges into it and adds its rules):
# rulesets:
#   - name: my-ruleset
#     target: branch
#     enforcement: active

# Carried from this repository's own previous settings.yml: what the
# apply would otherwise take away - it deletes labels the merged
# document does not declare, and a null is this repo's own opt-out
# from managing that key.
labels:
  - name: type:bug
    color: d73a4a
    description: Something isn't working
  - name: type:feature
    color: 1d76db
    description: New tool, capability, or change
  - name: type:security
    color: "5319e7"
    description: Change touching the security model
