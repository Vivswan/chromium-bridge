# The container test environment: the same image and mounts for the gate, the browser suites, and a
# shell. Keys stay within the Compose Specification subset both `docker compose` and `podman compose`
# implement (scripts/check-compose-compat.ts gates it), and the container gets no privilege, socket,
# or host network: the isolation from the host's browsers is the point.
#
# `moon run ci-container` / `test-browser-container` / `shell-container` run this through
# scripts/compose-run.ts, which supplies the three facts only the host knows:
#   UID, GID           -> the caller's ids, so files the container writes on the bind mount are theirs
#                         (docker on Linux; Docker Desktop and podman keep-id map ids themselves)
#   COMPOSE_GIT_DIR    -> a linked worktree's git common dir, mounted read-only at its own absolute
#                         path because the worktree's .git file names it by that path; a plain
#                         checkout mounts its own .git read-only instead
# Podman rootless adds compose.podman.yaml (compose-run.ts does when CONTAINER_ENGINE=podman).

# One project name, so every checkout and worktree of the repository shares the named volumes.
name: chromium-bridge

x-ci: &ci
  build:
    context: .
    dockerfile: Containerfile
  image: chromium-bridge-ci
  user: "${UID:-1000}:${GID:-1000}"
  working_dir: /work
  init: true
  shm_size: 1gb
  volumes:
    - ./:/work:z
    # Long form: an interpolated mount keeps its options as fields a variable cannot reach.
    - type: bind
      source: ${COMPOSE_GIT_DIR:-./.git}
      target: ${COMPOSE_GIT_DIR:-/work/.git}
      read_only: true
      bind:
        selinux: z
    - cargo-registry:/home/ci/.cargo/registry
    - cargo-target:/work/target
    - bun-cache:/home/ci/.bun/install/cache
    - node-modules:/work/node_modules
    - moon-cache:/work/.moon/cache

services:
  ci:
    <<: *ci
    command: ["moon", "run", "ci"]

  browser:
    <<: *ci
    environment:
      # A skipped suite fails as in CI, and every finished suite leaves its RAN marker where the host
      # can read it after the run (tmp/ is gitignored); the script requires all three.
      BB_REQUIRE_BROWSER: "1"
      BB_BROWSER_CANARY_DIR: /work/tmp/browser-canary
    command: ["scripts/container-browser-suites.sh"]

  shell:
    <<: *ci
    stdin_open: true
    tty: true
    command: ["bash"]

# Linux artifacts stay out of the host checkout, and reruns start warm.
volumes:
  cargo-registry:
  cargo-target:
  bun-cache:
  node-modules:
  moon-cache:
