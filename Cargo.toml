[workspace]
resolver = "2"
members = ["src/packages/core", "src/apps/host"]
# `src/packages/core/fuzz/` is its own (nightly + libFuzzer) workspace; keep it
# out of the main build/test graph so a stable `cargo` build never tries to
# compile it.
exclude = ["src/packages/core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
# Source-available (see LICENSE.md); the crates ship as release binaries, never
# to crates.io. Also lets cargo-deny's license gate treat them as private.
publish = false

[workspace.dependencies]
# base64 for the host identity proof frames and the signed policy baseline
# (src/packages/core/src/enclave). Without the default `simd-unsafe`
# feature: the scalar engine is all 65-byte keys and signatures need.
base64 = { version = "0.23", default-features = false, features = ["std"] }
# The argv boundary (src/packages/core/src/cli.rs): clap parses argv once into
# the typed Command tree. Derive only: no color, suggestions, or help wrapping,
# so the shipped binary carries the parser and nothing cosmetic.
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# OS CSPRNG for the per-run secret, the handshake nonces, and (as the rand_core
# source `sys_rng` exposes) p256's own scalar sampling for the host key. `std`
# for the conversion into io::Error.
getrandom = { version = "0.4", features = ["std", "sys_rng"] }
# Hex for MACs, nonces, and image/key fingerprints.
hex = "0.4"
hmac = "0.13"
libc = "0.2.186"
# Safe sigmask wrapper for the signal-cleanup thread (src/packages/core/src/sys.rs): `signal`; the
# effective-uid read behind the registration scope gate (src/packages/core/src/registration.rs): `user`.
nix = { version = "0.31", default-features = false, features = ["signal", "user"] }
# The official MCP Rust SDK: the whole MCP protocol layer (lifecycle,
# per-request version gate, wire model), a many-eyes library in place of
# hand-rolled JSON-RPC dispatch. `server` only: no HTTP stack, no client, no auth tree.
rmcp = { version = "3.4.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
# The refusal-code roster (src/packages/core/src/webauthn/refusal.rs): the variant list the contract emitter
# walks and the snake_case wire names, derived once instead of a hand-kept list beside the enum.
strum = { version = "0.27", features = ["derive"] }
# SIGTERM/SIGINT delivery to the cleanup thread (src/packages/core/src/sys.rs). Unix only.
signal-hook = "0.4"
# `float_roundtrip`: correctly rounded float parsing, so a JSON number the
# core stores reads back as the same f64 it wrote. The default best-effort parse drifts by an ulp on some
# inputs, which breaks the write/read-back identity the store relies on.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
# Temp-file-then-rename atomic writers (registration, private records).
tempfile = "3.27"
thiserror = "2.0.18"
# rmcp's async runtime. The security core itself stays synchronous; tokio
# only runs the per-connection MCP services (src/packages/core/src/mcp/) on a
# small shared runtime, so only the runtime + channel + blocking-pool
# features are enabled - no net, no fs, no process drivers.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
# Sink/Stream traits + channels + a runtime-free block_on, bridging the
# synchronous broker serve loop to the rmcp services. Already in rmcp's tree.
futures = "0.3"
# Property-based testing for the protocol parsing boundary. Kept lean
# (no `fork`/`timeout`/`regex-syntax` features) so it spawns no processes and
# its dependency tree stays within the licenses allowed by `deny.toml`.
proptest = { version = "1", default-features = false, features = ["std"] }
# P-256 ECDSA: the WebAuthn assertion verifier (src/packages/core/src/webauthn) and
# the host identity key's signer (src/packages/core/src/enclave). RFC 6979
# deterministic signing, so the emit_enclave_contract fixture regenerates
# byte-identical.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# COSE key parsing for WebAuthn registration (the credential public key inside
# attestedCredentialData): coset gives the typed EC2 labels, ciborium the CBOR
# decoder underneath it and the attestationObject map. Both over a hand parser.
coset = "0.4"
ciborium = "0.2"
# The runtime-record matrix test (src/packages/core/src/runtime_record.rs) parses the crate's own record
# modules for serde attributes and inherent items; `span-locations` gives the refusal its line. Dev-only:
# a dev-dependency never enters the shipped graph.
syn = { version = "3", features = ["full"] }
proc-macro2 = { version = "1", features = ["span-locations"] }
# The host identity key's home (src/packages/core/src/enclave): one API over the
# OS credential stores. No default features; each target enables its own store
# in the core's manifest. The Linux store is the pure-Rust zbus Secret Service
# client over the tokio runtime already in the graph, so nothing links libdbus
# or OpenSSL.
keyring = { version = "3.6", default-features = false }
# Peer attestation on macOS (src/packages/core/src/ipc/platform/macos.rs): the
# vetted Security.framework wrapper, the -sys crate for the constants the
# wrapper does not re-export, and core-foundation for reading the attested
# code's attributes, instead of hand-rolled FFI.
core-foundation = "0.10"
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
# HKCU native-messaging registration on Windows
# (src/packages/core/src/registration.rs). The vetted wrapper (rust-lang
# community, windows-sys underneath) instead of hand-rolled Advapi32 FFI.
winreg = "0.56"
# Microsoft's binding for the named-pipe bridge transport, the pipe peer's
# process identity, and the Authenticode signer query
# (src/packages/core/src/ipc/platform/windows/); already in the tree under
# tempfile and winreg, so the version follows theirs.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
# Schema derivation for the wire envelopes: the emit_envelope_schema
# example (behind the core's `envelope-schema` feature) feeds
# scripts/gen-envelope.ts, which generates the extension's Zod validators
# (`moon run gen`; `check-gen` fails on a stale diff). OUR gen
# feature stays out of default and release builds; note that rmcp compiles
# its own schemars dependency into the shipped binary for its runtime tool
# schemas - check-gen-isolation pins that rmcp is the only path.
schemars = "1"
# Model checker for the broker's ref-count shutdown protocol (src/packages/core/src/broker.rs).
# Optional behind the core's `loom` feature, which substitutes it in the test compilation only.
loom = "0.7"
# The version is stated alongside the path so the dependency is not a
# version-less wildcard: `cargo deny check bans` (wildcards = "deny") treats
# a bare path dependency as `*` and fails the supply-chain gate. "0" (any
# 0.x) rather than the exact version, so 0.x release bumps of
# workspace.package.version do not have to touch this line; the 1.0 bump
# must widen it.
chromium-bridge-core = { path = "src/packages/core", version = "0" }

# Workspace-wide lint tables; every member opts in via `[lints] workspace =
# true`. The fuzz crate is its own workspace and carries a copy of this whole
# table minus the exceptions its manifest names, so a change here is made in
# src/packages/core/fuzz/Cargo.toml too.
#
# Every gating entry is deny, matching CI's `cargo clippy -- -D warnings`, so
# no lint listed here passes locally and fails CI. The one allow (rustdoc's
# private_intra_doc_links) is a deliberate exception, explained at its entry.
# In code, an exception is `#[expect(lint, reason = "...")]`: it says why and
# fails once the lint no longer fires there.
#
# Curated rather than `clippy::pedantic` wholesale: the pedantic group is
# dominated by doc/naming noise, and its useful cast lints are subsumed by
# `as_conversions` below. clippy.toml's `allow-*-in-tests` settings exempt
# test code from the panic-family bans; `arithmetic_side_effects` and
# `as_conversions` have no such setting, so the core crate exempts its test
# build with `#![cfg_attr(test, expect(...))]`.
[workspace.lints.rust]
# Unsafe is quarantined: denied everywhere, re-admitted at the top of an
# audited FFI module (ipc/platform/*, ipc/peercred.rs, sys.rs) with
# `#![expect(unsafe_code, reason = "...")]`, and reached from safe code only
# through that module's safe API.
unsafe_code = "deny"
# An unsafe fn body is not an unsafe scope: each unsafe operation in it sits
# in its own block, with its own SAFETY comment.
unsafe_op_in_unsafe_fn = "deny"
# Typography policy (no look-alike characters) extended to identifiers.
non_ascii_idents = "deny"
# A cfg name rustc does not know (a typo, or a feature that was renamed) fails the build instead of
# silently compiling the guarded code out.
unexpected_cfgs = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
# Ours on top of the fleet starter: the default lint group at deny, so a bare
# local `cargo clippy` fails on it like CI's `-D warnings` does. priority -1
# lets the specific entries below override the group.
all = { level = "deny", priority = -1 }
# `// SAFETY:` above every unsafe block, stating the invariant it depends on.
undocumented_unsafe_blocks = "deny"
# One unsafe block, one operation: a comment that covers several cannot be
# checked.
multiple_unsafe_ops_per_block = "deny"
# Every public unsafe fn carries a `# Safety` doc section: the contract its
# safe wrapper must uphold.
missing_safety_doc = "deny"
# The duals: a SAFETY comment on a safe block, or a `# Safety` section on a
# safe fn, is a claim the code no longer makes.
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
# `allow` hides a lint for good; `expect` with a reason records why and fails
# when the cause is gone.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"
# A match on an enum lists every variant, so a new one is a compile error at
# each site, never a silent fallthrough. A foreign `#[non_exhaustive]` enum
# forces a `_` arm; that arm takes an `expect` naming the enum.
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
# A struct pattern that binds every field carries no `..`, so a `..` always
# marks a deliberate skip.
rest_pat_in_fully_bound_structs = "deny"
# Leftover-debug and stub markers must never ship.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# mem::forget on a guard silently skips Drop-based cleanup (lockfiles,
# sockets); there is no legitimate use in this codebase.
mem_forget = "deny"
# Casting a function pointer to an integer of a different size truncates it.
fn_to_numeric_cast_any = "deny"
# No-panic policy: the bridge must fail closed with a typed error on stderr,
# never abort mid-handshake. Applies to every crate; test code is exempt via
# clippy.toml's allow-*-in-tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
# Silent numeric coercion and unchecked arithmetic are how parsers acquire
# truncation and overflow bugs; require From/TryFrom and checked/saturating
# operations so every lossy step is an explicit, reviewable decision.
as_conversions = "deny"
arithmetic_side_effects = "deny"
# Instant/Duration subtraction panics on underflow.
unchecked_time_subtraction = "deny"

[workspace.lints.rustdoc]
# A doc link to an item that is not there fails, as the docs site's link
# check does for pages. CI runs `cargo doc` with `-D warnings` for the rest
# of rustdoc's lints.
broken_intra_doc_links = "deny"
# These crates never publish; their docs are built with
# `--document-private-items`, so a public item's doc linking a private one is
# the intended cross-reference, not a dangling link.
private_intra_doc_links = "allow"

# codegen-units=1 and strip=symbols also serve reproducibility: one codegen
# unit removes parallel-codegen variance, and stripping drops the symbol/debug
# sections most likely to leak build-machine paths. Path remapping and
# SOURCE_DATE_EPOCH live in scripts/build-repro.ts (used by the release
# workflow), since they need the concrete checkout path at build time.
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = "symbols"
