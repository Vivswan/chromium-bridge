[workspace]
resolver = "2"
members = ["src/packages/core", "src/apps/host", "src/apps/desktop"]
# Keep the default build/test/clippy surface pinned to the security core and
# the host binary. Future members (e.g. a Tauri app) must be added here only
# by an explicit decision, so `cargo test` stays the gate for the core.
# The Tauri desktop shell (src/apps/desktop) is a member but deliberately NOT
# a default member: build it explicitly via `moon run bundle-app` or
# `cargo build -p chromium-bridge-desktop` (tauri-build reads the generated
# app icon at compile time: run `moon run gen-icons` first on a clean checkout).
default-members = ["src/packages/core", "src/apps/host"]
# `src/packages/core/fuzz/` is its own (nightly + libFuzzer) workspace; keep it
# out of the main build/test graph so a stable `cargo` build never tries to
# compile it.
exclude = ["src/packages/core/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE.md"
# Source-available (see LICENSE.md); the crates ship as release binaries, never
# to crates.io. Also lets cargo-deny's license gate treat them as private.
publish = false

[workspace.dependencies]
hmac = "0.13"
libc = "0.2.186"
# The official MCP Rust SDK: the whole MCP protocol layer (lifecycle,
# per-request version gate, wire model) per ADR-0034 - a many-eyes library
# replacing our hand-rolled JSON-RPC dispatch, exactly the trade ADR-0023
# prescribes. `server` only: no HTTP stack, no client, no auth tree.
rmcp = { version = "3.2.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false }
thiserror = "2.0.18"
# rmcp's async runtime. The security core itself stays synchronous; tokio
# only runs the per-connection MCP services (src/packages/core/src/mcp/) on a
# small shared runtime, so only the runtime + channel + blocking-pool
# features are enabled - no net, no fs, no process drivers.
tokio = { version = "1.53", default-features = false, features = ["rt-multi-thread", "sync", "time"] }
# Sink/Stream traits + channels + a runtime-free block_on, bridging the
# synchronous broker serve loop to the rmcp services. Already in rmcp's tree.
futures = "0.3"
# Property-based testing for the protocol parsing boundary. Kept lean
# (no `fork`/`timeout`/`regex-syntax` features) so it spawns no processes and
# its dependency tree stays within the licenses allowed by `deny.toml`.
proptest = { version = "1", default-features = false, features = ["std"] }
# Software P-256 for the enclave golden-vector fixture (the emit_enclave_contract
# example, `moon run gen`): RFC 6979 deterministic signing, so regenerating the
# checked-in fixture is byte-identical. Dev-only - the shipped host signs with
# the Secure Enclave via security-framework, never with a software key.
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
# Secure Enclave enrollment key (src/packages/core/src/enclave.rs). The vetted
# wrapper crate is used instead of hand-rolled Security.framework FFI;
# OSX_10_15 is required for the data-protection keychain, the only keychain
# that can hold Secure Enclave keys. The -sys crate is a direct dependency
# only for the SecAccessControl flag constants the wrapper does not re-export,
# and core-foundation only for reading key attributes (token-id validation).
core-foundation = "0.10"
security-framework = { version = "3", features = ["OSX_10_15"] }
security-framework-sys = "2"
# HKCU native-messaging registration on Windows
# (src/packages/core/src/registration.rs). The vetted wrapper (rust-lang
# community, windows-sys underneath) instead of hand-rolled Advapi32 FFI.
winreg = "0.56"
# Schema derivation for the wire envelopes (ADR-0028): the emit_envelope_schema
# example (behind the core's `envelope-schema` feature) feeds the CI
# double-derivation diff against the extension's Zod validators. OUR gen
# feature stays out of default and release builds; note that rmcp compiles
# its own schemars dependency into the shipped binary for its runtime tool
# schemas (ADR-0034) - check-gen-isolation pins that rmcp is the only path.
schemars = "1"
# TypeScript type generation for the desktop app's Tauri command DTOs (the
# `moon run gen` -> commands.gen.ts flow). Like schemars, this is gen-only
# tooling behind a non-default `ts-export` feature: no shipped binary
# compiles it, and the check-gen-isolation task asserts that.
ts-rs = "12"
# The version is stated alongside the path so the dependency is not a
# version-less wildcard: `cargo deny check bans` (wildcards = "deny") treats
# a bare path dependency as `*` and fails the supply-chain gate. "0" (any
# 0.x) rather than the exact version, so 0.x release bumps of
# workspace.package.version do not have to touch this line; the 1.0 bump
# must widen it.
chromium-bridge-core = { path = "src/packages/core", version = "0" }
# Tauri v2 desktop shell (src/apps/desktop only; never a dependency of the
# security core or the host). Policy per ADR-0023: the GUI layer carries no
# security weight, so the widely-audited framework is the right trust
# boundary there.
tauri = "2"
tauri-build = "2"

# Workspace-wide lint floor; every member opts in via `[lints] workspace =
# true`. CI promotes warn to deny (`cargo clippy -- -D warnings`), so "warn"
# here is a hard gate. The set is deliberately curated rather than
# `clippy::pedantic` wholesale: the pedantic group is dominated by doc/naming
# noise, and its useful cast lints are subsumed by `as_conversions` below.
# Test code is exempted from the panic-family bans by clippy.toml's
# `allow-*-in-tests` settings; `arithmetic_side_effects` and `as_conversions`
# have no such config, so crates exempt their test builds with
# `#![cfg_attr(test, allow(...))]` (the non-test target still enforces both
# on production code).
[workspace.lints.rust]
# Zero-trust quarantine: unsafe is denied everywhere and re-allowed only in
# the audited FFI modules (ipc/platform/*, ipc/peercred.rs, enclave/macos.rs,
# sys.rs), each with a scoped `#![allow(unsafe_code)]` and justification.
unsafe_code = "deny"
# Typography policy (no look-alike characters) extended to identifiers.
non_ascii_idents = "deny"
# `loom` is an explicit, self-set cfg (see the loom dev-dependency in
# src/packages/core), not a typo; teach check-cfg about it workspace-wide.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
unused_lifetimes = "warn"

[workspace.lints.clippy]
# Leftover-debug and stub markers must never ship.
dbg_macro = "warn"
todo = "deny"
unimplemented = "deny"
# mem::forget on a guard silently skips Drop-based cleanup (lockfiles,
# sockets); there is no legitimate use in this codebase.
mem_forget = "warn"
# Casting a function pointer to an integer of a different size truncates it.
fn_to_numeric_cast_any = "warn"
# No-panic policy: the bridge must fail closed with a typed error on stderr,
# never abort mid-handshake. Applies to every crate; test code is exempt via
# clippy.toml's allow-*-in-tests.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
indexing_slicing = "deny"
string_slice = "deny"
unreachable = "deny"
# Silent numeric coercion and unchecked arithmetic are how parsers acquire
# truncation and overflow bugs; require From/TryFrom and checked/saturating
# operations so every lossy step is an explicit, reviewable decision.
as_conversions = "deny"
arithmetic_side_effects = "deny"
# Instant/Duration subtraction panics on underflow.
unchecked_time_subtraction = "deny"

# codegen-units=1 and strip=symbols also serve reproducibility: one codegen
# unit removes parallel-codegen variance, and stripping drops the symbol/debug
# sections most likely to leak build-machine paths. Path remapping and
# SOURCE_DATE_EPOCH live in scripts/build-repro.ts (used by the release
# workflow), since they need the concrete checkout path at build time.
[profile.release]
opt-level = "z"
lto = true
panic = "abort"
codegen-units = 1
strip = "symbols"
