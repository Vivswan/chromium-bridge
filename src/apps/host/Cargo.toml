[package]
name = "genkan"
version.workspace = true
edition.workspace = true
description = "Bridge an MCP client to your real Chromium browser via an extension + native messaging host"
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "genkan"
path = "src/main.rs"

[dependencies]
genkan-core.workspace = true

[lints]
workspace = true

# The .deb the release builds with cargo-deb (scripts/release-package.ts installer, `--no-build --no-strip`
# over the attested binary). The maintainer scripts register machine-wide (`doctor --fix --system`) and
# reverse it on removal: they run as root with no user context and may not write into home directories
# (docs/release.md).
[package.metadata.deb]
maintainer = "Genkan maintainers <noreply@github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../../../packaging/deb"
extended-description = """\
Authenticated MCP bridge to your real Chromium browsers (Brave, Chrome): a native-messaging host and \
MV3 extension, no debug port. Installing registers it with every account's browsers; `genkan \
doctor` shows the state."""
assets = [
    ["target/release/genkan", "usr/bin/", "755"],
    ["../../../README.md", "usr/share/doc/genkan/README.md", "644"],
]
