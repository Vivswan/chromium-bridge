[package]
name = "chromium-bridge"
version.workspace = true
edition.workspace = true
description = "Bridge an MCP client to your real Chromium browser via an extension + native messaging host"
license-file.workspace = true
publish.workspace = true

[[bin]]
name = "chromium-bridge"
path = "src/main.rs"

[dependencies]
chromium-bridge-core.workspace = true

[lints]
workspace = true

# The .deb the release builds with cargo-deb (scripts/release-package.ts installer, `--no-build --no-strip`
# over the attested binary). The postinst only prints the `doctor --fix` line: a maintainer script runs as
# root with no user context and may not write into home directories (docs/release.md).
[package.metadata.deb]
maintainer = "Chromium Bridge maintainers <noreply@github.com>"
section = "utils"
priority = "optional"
depends = "$auto"
maintainer-scripts = "../../../packaging/deb"
extended-description = """\
Authenticated MCP bridge to your real Chromium browsers (Brave, Chrome): a native-messaging host and \
MV3 extension, no debug port. After installing, run `chromium-bridge doctor --fix` once to register \
with your browsers."""
assets = [
    ["target/release/chromium-bridge", "usr/bin/", "755"],
    ["../../../README.md", "usr/share/doc/chromium-bridge/README.md", "644"],
]
