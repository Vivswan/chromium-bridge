# moon tasks for src/packages/shared (contract-derived types + validators).
# moon is the canonical command interface; shared:test is a step
# of the root ci gate.
#
# generated/ is written by the root gen-shared task from the Rust core, so the
# readers depend on it, and the inherited rust-contract file group
# (.moon/tasks/all.yml) stays among their inputs so a core change invalidates
# their caches. Never narrow that edge. The project-wide mutex follows the
# root moon.yml header's rule.
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'library'

# Every task here reads the generated modules, so the mutex is a project default.
taskOptions:
  mutex: 'generated-contract'

tasks:
  typecheck:
    description: 'Type-check src/packages/shared alone (the repo-wide pass is the root typecheck task)'
    deps: ['root:gen-shared']
    command: 'bun run typecheck'
    inputs:
      - '**/*'
      - '!**/node_modules/**'
      - '/tsconfig.base.json'
      - '/package.json'
      - '/bun.lock'
      - '@group(rust-contract)'
    options:
      cache: true

  test:
    description: 'Unit-test src/packages/shared: generated catalogue, boundary validators'
    deps: ['root:gen-shared']
    command: 'bun run test'
    inputs:
      - '**/*'
      - '!**/node_modules/**'
      - '/tsconfig.base.json'
      - '/package.json'
      - '/bun.lock'
      - '@group(rust-contract)'

  lint:
    description: "Biome lint for the shared package"
    # Same invocation shape as the repo-wide gate (`bun run biome lint .` from
    # the root), scoped to this project so config resolution is identical.
    deps: ['root:gen-shared']
    command: 'bun run biome lint $projectSource'
    inputs:
      - '**/*'
      - '!**/node_modules/**'
      - '/biome.jsonc'
      - '/.gitignore'
      - '/package.json'
      - '/bun.lock'
    options:
      runFromWorkspaceRoot: true
