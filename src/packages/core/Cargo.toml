[package]
name = "chromium-bridge-core"
version.workspace = true
edition.workspace = true
description = "Chromium Bridge library: IPC, protocols, session, tools, host identity and presence"
license-file.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
ciborium.workspace = true
clap.workspace = true
coset.workspace = true
futures.workspace = true
getrandom.workspace = true
hex.workspace = true
hmac.workspace = true
libc.workspace = true
loom = { workspace = true, optional = true }
p256.workspace = true
rmcp.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strum.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true

[features]
# Contract-generation apparatus: JSON Schema derivation for the bridge
# envelopes, used only by the emit_envelope_schema example that feeds the
# extension's validator generator (scripts/gen-envelope.ts, `moon run gen`).
# Off by default and enabled by no binary; the schemars instance in shipped
# builds comes from rmcp (its runtime tool-schema model), never from this
# feature - check-gen-isolation enforces exactly that split.
envelope-schema = ["dep:schemars"]
# Fuzz-only surface: re-exports private internals (the handshake verifier, the
# registration ownership markers) for the cargo-fuzz workspace (the `fuzz/`
# subdirectory, its own workspace). Off by default; the fuzz workspace is the
# only build in this repo that enables it. Features are additive, so an
# --all-features build compiles it too - but no shipped binary enables it, and
# the gated modules are thin re-exports only, no behavior.
fuzzing = []
# Model-checking surface, test compilation only: the broker ref-count's Mutex/Condvar become loom's
# instrumented versions and the `loom_model` tests compile in (src/packages/core/src/broker.rs). A
# feature rather than loom's documented bare `--cfg loom`: the self dev-dependency below compiles this
# lib a second time as a plain dependency of the test harness, where a cfg still applies but a
# dev-dependency does not link. Off by default, so `cargo tree -e normal` never lists loom.
loom = ["dep:loom"]

[[example]]
name = "emit_envelope_schema"
required-features = ["envelope-schema"]

# Emits the canonical contract (tools, errors, capabilities, identity,
# protocol version) as JSON for scripts/gen-ops.ts (`moon run gen`). Plain
# serde_json over the library's own data - no feature, no extra deps.
[[example]]
name = "emit_contract"

# Emits the host identity signing contract (domains, bounds, key/sig lengths,
# reason codes) plus the golden-vector fixture for scripts/gen-ops.ts (`moon
# run gen`). Signs with the public fixture scalar (RFC 6979 deterministic, so
# regeneration is byte-identical).
[[example]]
name = "emit_enclave_contract"

[dev-dependencies]
# This crate's own gen-only feature, on for test builds only: the control-frame tests derive the tag set
# and the request shapes from the same JSON Schemas the contract emitter uses. A dev-dependency never
# reaches `cargo tree -e normal`, so check-gen-isolation still keeps schemars out of the shipped binary.
chromium-bridge-core = { path = ".", features = ["envelope-schema"] }
proc-macro2.workspace = true
proptest.workspace = true
syn = { workspace = true, features = ["visit"] }

[lints]
workspace = true

# One credential store per target behind keyring's single API (src/packages/core/src/enclave/store.rs):
# the Keychain, the Credential Manager, and the Secret Service over the pure-Rust zbus client on tokio.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation.workspace = true
keyring = { workspace = true, features = ["apple-native"] }
security-framework.workspace = true
security-framework-sys.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true
signal-hook.workspace = true

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { workspace = true, features = ["async-secret-service", "tokio", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }
windows-sys.workspace = true
winreg.workspace = true
