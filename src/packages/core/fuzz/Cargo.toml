[package]
name = "chromium-bridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license-file = "../../../../LICENSE.md"

[package.metadata]
cargo-fuzz = true

# Its own workspace, excluded by the root Cargo.toml, so the fuzz crate never enters the main `cargo build`/
# `cargo test` graph (`cargo fuzz run` needs nightly + libFuzzer; the library, its tests, and the seed
# generator example build on stable). An excluded crate inherits no lint table, so the root's
# [workspace.lints] is copied below, verbatim except the four entries here, and a change to the root table
# is made here too. The four stay off because a harness's oracle IS a panic, and clippy.toml's
# allow-*-in-tests cannot reach a fuzz binary or the seed generator:
#
#   expect_used              -> the harness assertion: a generator or target stops with its message on an
#                               impossible fixture
#   panic                    -> the oracle's failure arm: a schema fragment the seed generator has no rule
#                               for, or a request whose own serialization does not classify as a request
#   indexing_slicing         -> seeds are hand-built fixed-size byte strings, so the slice bound is the fixture
#   arithmetic_side_effects  -> seed lengths and version bumps on those fixtures; an overflow there is a
#                               harness bug, and stopping is the right outcome
#
# `fuzz_target!` expands to libFuzzer's unsafe extern hooks; the unsafe lints do not fire on external-macro
# expansions, so `unsafe_code = "deny"` holds without an expect on every binary.
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"
unexpected_cfgs = "deny"
unused_lifetimes = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
rest_pat_in_fully_bound_structs = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
fn_to_numeric_cast_any = "deny"
unwrap_used = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
unreachable = "deny"
as_conversions = "deny"
unchecked_time_subtraction = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[lints]
workspace = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde = "1"
serde_json = "1"
chromium-bridge-core = { path = "..", features = ["fuzzing"] }

[dev-dependencies]
tempfile = "3.27"

[profile.release]
debug = 1

# One binary per wire parser at a trust boundary. Each feeds arbitrary bytes to
# the real decoder; libFuzzer catches any panic or abort (the no-crash guarantee
# for a parser on a security boundary under `panic = "abort"`), and the targets
# add an oracle where one exists: decode -> encode -> decode identity for the
# serde messages, a documented invariant for the verifiers.
[[bin]]
name = "nm_frame"
path = "fuzz_targets/nm_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_jsonrpc"
path = "fuzz_targets/mcp_jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bridge_envelope"
path = "fuzz_targets/bridge_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attach"
path = "fuzz_targets/attach.rs"
test = false
doc = false
bench = false

# The semantic layer behind the decoders: verifiers and validators that run on
# attacker-controlled input after it parses. Structured (Arbitrary) inputs
# where the surface is typed fields, raw bytes where it is a byte parser.
[[bin]]
name = "handshake_verify"
path = "fuzz_targets/handshake_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify_frame"
path = "fuzz_targets/classify_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enclave_challenge"
path = "fuzz_targets/enclave_challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registration_manifest"
path = "fuzz_targets/registration_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_doc"
path = "fuzz_targets/policy_doc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "webauthn_authdata"
path = "fuzz_targets/webauthn_authdata.rs"
test = false
doc = false
bench = false

