[package]
name = "chromium-bridge-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license-file = "../../../../LICENSE.md"

[package.metadata]
cargo-fuzz = true

# Its own workspace so the fuzz crate (nightly + libFuzzer only) never enters
# the main `cargo build`/`cargo test` graph. The root Cargo.toml also lists it
# under [workspace].exclude. Excluded means the root lint tables do not reach
# this crate, so the fleet floor entries (not the root's extra no-panic and
# numeric lints) are re-declared here and inherited below; a change to the
# floor is made in both files. (`fuzz_target!` expands to libFuzzer's unsafe
# extern hooks, but the lints do not fire on external-macro expansions.)
[workspace]

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
non_ascii_idents = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
missing_assert_message = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
rest_pat_in_fully_bound_structs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "allow"

[lints]
workspace = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
chromium-bridge-core = { path = "..", features = ["fuzzing"] }

[profile.release]
debug = 1

# One binary per wire parser at a trust boundary. Each feeds arbitrary bytes to
# the real decoder and asserts (implicitly, via libFuzzer catching a panic or
# abort) that no input crashes it -- the robustness guarantee for a parser that
# runs on a security boundary under `panic = "abort"`.
[[bin]]
name = "nm_frame"
path = "fuzz_targets/nm_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mcp_jsonrpc"
path = "fuzz_targets/mcp_jsonrpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bridge_envelope"
path = "fuzz_targets/bridge_envelope.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake"
path = "fuzz_targets/handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "attach"
path = "fuzz_targets/attach.rs"
test = false
doc = false
bench = false

# The semantic layer behind the decoders: verifiers and validators that run on
# attacker-controlled input after it parses. Structured (Arbitrary) inputs
# where the surface is typed fields, raw bytes where it is a byte parser.
[[bin]]
name = "handshake_verify"
path = "fuzz_targets/handshake_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify_frame"
path = "fuzz_targets/classify_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enclave_der"
path = "fuzz_targets/enclave_der.rs"
test = false
doc = false
bench = false

[[bin]]
name = "enclave_challenge"
path = "fuzz_targets/enclave_challenge.rs"
test = false
doc = false
bench = false

[[bin]]
name = "registration_manifest"
path = "fuzz_targets/registration_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "policy_doc"
path = "fuzz_targets/policy_doc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pending_import"
path = "fuzz_targets/pending_import.rs"
test = false
doc = false
bench = false
