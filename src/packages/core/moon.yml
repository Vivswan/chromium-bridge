# moon tasks for the Rust security core: the cargo gate steps the root gate aggregate (moon.yml at the
# repo root) depends on, under its header's rules (--frozen on every verb that reads crates).
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
layer: 'library'

# Cargo resolves the workspace from the root Cargo.toml (which pins the
# default members to the core + host), so run every cargo verb from the
# workspace root - byte-identical to running the cargo verbs by hand.
taskOptions:
  runFromWorkspaceRoot: true

# The root moon.yml header's rule for every cargo verb the gate reaches.
env:
  RUSTUP_AUTO_INSTALL: '0'

fileGroups:
  # Everything a workspace-level cargo verb can read: every member's sources,
  # the workspace manifests, and the toolchain/lint pins.
  workspace-rust:
    - '/src/packages/core/**/*'
    - '/src/apps/host/**/*'
    - '/Cargo.toml'
    - '/Cargo.lock'
    - '/rust-toolchain.toml'
    - '/rustfmt.toml'
    - '/clippy.toml'

tasks:
  build:
    description: 'Build the cargo workspace default members (debug)'
    command: 'cargo build'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS']

  test:
    description: 'Rust unit + integration tests (cargo-nextest)'
    command: 'cargo nextest run --frozen'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS']

  test-doc:
    description: 'Rust doctests'
    command: 'cargo test --frozen --doc'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS', '$RUSTDOCFLAGS']

  test-loom:
    # Only the model: every other test the feature build could run is a rerun of core:test.
    description: 'Model-check the broker ref-count shutdown protocol with loom (the core `loom` feature)'
    command: 'cargo test --frozen -p genkan-core --lib --features loom loom_model'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS']

  # The fuzz workspace is excluded from the root one, so a root-level cargo verb never reaches it. Plain
  # commands, not one script: moon's script shell is pwsh on Windows, where `set -e` does not stop at a
  # failed first verb. Sequential: two clippy runs at once contend for cargo's package cache lock.
  lint:
    description: 'Lint every Rust workspace (root + fuzz), denying all warnings (the CI gate)'
    deps: ['~:lint-workspace', '~:lint-fuzz']
    options:
      runDepsInParallel: false

  lint-workspace:
    description: 'Clippy over the root cargo workspace, denying all warnings'
    command: 'cargo clippy --frozen --all-targets -- -D warnings'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS']

  lint-fuzz:
    description: 'Clippy over the fuzz workspace, denying all warnings'
    command: 'cargo clippy --frozen --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets -- -D warnings'
    inputs: ['@group(workspace-rust)', '$RUSTFLAGS']

  fmt-check:
    description: 'Verify Rust formatting in every workspace (root + fuzz; CI gate)'
    deps: ['~:fmt-check-workspace', '~:fmt-check-fuzz']
    options:
      runDepsInParallel: false

  fmt-check-workspace:
    description: 'Verify Rust formatting in the root cargo workspace'
    command: 'cargo fmt --check'
    inputs: ['@group(workspace-rust)']

  fmt-check-fuzz:
    description: 'Verify Rust formatting in the fuzz workspace'
    command: 'cargo fmt --check --manifest-path src/packages/core/fuzz/Cargo.toml'
    inputs: ['@group(workspace-rust)']
