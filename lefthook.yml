# Git hooks, managed by lefthook (https://lefthook.dev). The hook checks and fails, never installs, stages, or
# commits; what `gate` may run is the root moon.yml header's rule.
#
#   wire or re-wire the hooks   -> `moon run setup` (lefthook's postinstall) or `lefthook install`
#   moon                        -> proto's ~/.proto/shims and ~/.proto/bin (`proto install`, .prototools), prefixed
#                                  below so a git client that starts hooks without your shell's PATH still finds it
#   skip for a WIP commit       -> LEFTHOOK=0 git commit (CI runs the full gate on the PR)

pre-commit:
  jobs:
    - name: gate
      run: PATH="$HOME/.proto/shims:$HOME/.proto/bin:$PATH" moon run gate
