# Git hooks, managed by lefthook (https://lefthook.dev). The hook checks and fails; it never installs, stages,
# or commits, and it runs only what the repository's own toolchain provides (`moon run gate`; `moon run ci`
# adds the CI-only tools). A tree not installed to bun.lock, or crates not fetched to Cargo.lock, fails the
# gate naming `moon run setup`.
#
#   wire or re-wire the hooks   -> `moon run setup` (lefthook's postinstall) or `lefthook install`
#   moon on PATH                -> proto (`proto install`, .prototools): ~/.proto/shims and ~/.proto/bin
#   skip for a WIP commit       -> LEFTHOOK=0 git commit (CI runs the full gate on the PR)

pre-commit:
  jobs:
    - name: gate
      run: moon run gate
