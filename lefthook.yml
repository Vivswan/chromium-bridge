# Git hooks, managed by lefthook (https://lefthook.dev). The hooks check and fail; they never change what a
# commit contains (no stage, no commit, no fix-then-pass) and install no project dependency. The checks refresh
# gitignored build outputs (.wxt/, build/extension) and nothing tracked. `static` is the root moon.yml's task, and
# its header says what the task may run.
#
#   wire or re-wire the hooks   -> `moon run setup` (lefthook's postinstall) or `lefthook install`
#   a commit staging a change   -> pre-commit runs `moon run static`; the test suites and builds are CI's on every PR
#   a refused commit            -> the commit is unchanged; each fail text names the fix tasks that exist (spelled out
#                                  twice, since lefthook expands a template in `run` alone)
#   a message-only amend        -> no check: lefthook skips every pre-commit job when nothing is staged, and the tree
#                                  is unchanged (judged already if the commit that made it ran the checks)
#   a rebase rewriting commits  -> post-rewrite runs the same checks, since the commits a rebase re-creates pass no
#                                  hook (git invokes pre-commit for none of them but a reword, which stages nothing);
#                                  the verdict comes after they exist, and a red one is fixed and amended, which
#                                  pre-commit judges
#   automatic commits           -> a clean cherry-pick or merge, and filter-branch, meet no hook here (a conflict
#                                  resolved by hand commits through pre-commit); CI judges the PR
#   PATH                        -> a GUI git client gives hooks /usr/bin:/bin, so the template prefixes every tool's
#                                  home: proto's shims and bin (moon, bun, uvx), rustup's ~/.cargo/bin, Homebrew's
#                                  keg-only rustup (`brew --prefix rustup`/bin) at both the Apple-silicon and the
#                                  Intel prefix, then both Homebrew bins (typos, actionlint): a machine with the
#                                  rust formula at one prefix and rustup at the other would otherwise put a
#                                  formula cargo ahead of rustup's proxies
#   hand-installed tools        -> typos and actionlint have no proto plugin (.prototools names the gap) and are
#                                  installed once by hand (docs/development.md)
#   rust                        -> RUSTUP_AUTO_INSTALL=0 here as well as in the cargo tasks: moon's task env yields to
#                                  an inherited value, and a commit must never download a toolchain
#   skip for a WIP commit       -> LEFTHOOK=0 git commit (CI runs the full gate on the PR)

templates:
  static: PATH="$HOME/.proto/shims:$HOME/.proto/bin:$HOME/.cargo/bin:/opt/homebrew/opt/rustup/bin:/usr/local/opt/rustup/bin:/opt/homebrew/bin:/usr/local/bin:$PATH" RUSTUP_AUTO_INSTALL=0 moon run static

pre-commit:
  jobs:
    - name: static checks
      run: '{static}'
      fail_text: >-
        refused; the commit is unchanged (the checks refresh gitignored build outputs, nothing tracked). Fix what the
        failing check reported above (when a task exists it is named: `moon run fmt` for formatting, `moon run fix`
        for Biome's fixable lints, `moon run gen-architecture-map` for the module map; otherwise edit the reported
        source or translation), stage, and commit again.

post-rewrite:
  jobs:
    - name: static checks after a rebase
      run: 'test "{1}" != rebase || {static}'
      fail_text: >-
        the rebase completed and its re-created commits exist; the static checks fail on the result (they refresh
        gitignored build outputs, nothing tracked). Fix what the failing check reported above (when a task exists it
        is named: `moon run fmt` for formatting, `moon run fix` for Biome's fixable lints,
        `moon run gen-architecture-map` for the module map; otherwise edit the reported source or translation),
        stage, and amend the re-created commit, which pre-commit judges.
