# Root project: the ci gate, the repo-wide aggregates, contract codegen, the python protocol suites, and the
# Touch ID runbooks. Unscoped task names resolve here via .moon/workspace.yml's defaultProject.
#
# The ci aggregate, everything reachable from it, the check-* tasks, the python suites, and the runbooks all set
# `options.cache: false`: moon's hasher cannot see gitignored inputs (the generated .wxt/tsconfig.json) and a
# mistaken hasher.ignorePatterns entry drops tracked files from every hash, so a cache hit could let unverified
# code land. The tools underneath (cargo, tsc, vite, bun) keep their own incremental caches, so warm reruns stay
# fast; affected-only `moon ci` is a local convenience, never the gate.
#
# The build, ci, test, test-rust, test-ts, release, and gen aggregates set `runDepsInParallel: false`, so their
# steps run in the listed order and a tree-mutating step (gen-shared rewrites the checked-in *.gen.ts modules)
# can never race a reader (biome, tsc) in a parallel lane. lint's two deps still run in parallel; neither writes.
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'tool'

tasks:
  # ----- front door ---------------------------------------------------------

  help:
    description: 'List every task with its description (the front door; raw JSON: `moon query tasks`)'
    command: 'bun scripts/help.ts'
    toolchains: ['system']
    options:
      cache: false
      runInCI: false

  # ----- main aggregates ----------------------------------------------------

  build:
    description: 'Build everything: shared typecheck, extension, web app, scripts typecheck, cargo workspace'
    deps:
      - 'shared:typecheck'
      - 'extension:build'
      - 'web:build'
    script: 'bunx tsc -p scripts && cargo build --workspace'
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  ci:
    # THE GATE - the cross-platform steps every change must pass locally:
    # rust fmt/clippy/nextest+doctests/rustdoc, typos/machete, TS typecheck/biome/
    # tests/extension build, protocol e2e, the excluded fuzz workspace's
    # locked check, and the contract + hygiene checks. CI runs MORE on top: the
    # macOS/Windows rust matrices, dependency review, linux-install, the
    # adversarial/chaos suites, the browser suites (isolated Chrome), and
    # the web build. Every dep here is uncached (see the header) and
    # runs in this exact order, sequentially - the gate always executes
    # fully; there is nothing a cache or a scheduler can skip or reorder.
    description: 'THE GATE: the local cross-platform gate steps (CI layers more jobs on top - see the comment); uncached, sequential, always full'
    deps:
      - 'core:fmt-check'
      - 'core:lint'
      - '~:typos'
      - '~:machete'
      - 'core:test'
      - 'core:test-doc'
      - '~:doc'
      - '~:typecheck'
      - '~:check-ts'
      - 'shared:test'
      - 'extension:test'
      - 'extension:build'
      - '~:test-e2e'
      - '~:check-version'
      - '~:check-extension-id'
      - '~:check-cjk'
      - '~:check-typography'
      - '~:check-fuzz-smoke'
      - '~:check-harness-driver'
      - '~:check-fuzz-workspace'
      - '~:check-gen'
      - '~:check-envelope'
      - '~:check-gen-isolation'
      - '~:check-toolchain'
      - '~:check-hasher'
      - '~:check-ignored'
      - '~:check-yaml'
      - '~:check-actions'
      - '~:check-docs-literals'
      - '~:check-docs-policy'
      - '~:check-compose'
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  test:
    description: 'All tests that run without a browser: Rust (nextest + doctests), then protocol e2e'
    deps:
      - 'core:test'
      - 'core:test-doc'
      - '~:test-e2e'
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  test-rust:
    description: 'Rust unit + integration tests (cargo-nextest), plus doctests'
    deps:
      - 'core:test'
      - 'core:test-doc'
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  release:
    description: 'Pre-release gate: versions consistent + full ci (release-please cuts the actual release)'
    deps:
      - '~:check-version'
      - '~:check-extension-id'
      - '~:ci'
    script: |
      echo "Release checks passed. Releases are cut by release-please: merge the rolling release PR (chore(main): release X.Y.Z) on a green main."
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  install:
    description: 'USER-RUN: build the release binary, then register it with your browsers (doctor --fix)'
    deps: ['~:build-release']
    command: './target/release/chromium-bridge doctor --fix'
    toolchains: ['system']
    options:
      cache: false # user-run: must really run
      runInCI: false

  # ----- dev loops (local only; never in CI) --------------------------------

  dev:
    description: 'Dev everything: extension (WXT) + web app (Astro) + a dev browser in one terminal; Ctrl-C stops all'
    command: 'bun scripts/dev.ts'
    toolchains: ['system']
    preset: 'server'

  dev-web:
    # Deliberately NOT persistent: the web project's dev script manages the
    # astro dev daemon itself (`astro dev stop; ASTRO_DEV_BACKGROUND=1 astro
    # dev`) - it backgrounds the server and exits, so as a moon task it is a
    # plain one-shot command, not a `persistent` server task.
    description: 'Docs site dev server only; replaces any already-running astro dev (`dev` supersets this)'
    command: 'bun run --cwd src/apps/web dev'
    toolchains: ['system']
    options:
      cache: false # dev loop
      runInCI: false

  # ----- quality ------------------------------------------------------------

  fmt:
    description: 'Format everything in place: Rust (cargo fmt) + TS/JS/JSON (Biome)'
    script: 'set -e; cargo fmt; bunx biome format --write .'
    toolchains: ['system']
    options:
      cache: false # mutates the tree
      runInCI: false # tree-mutating: never eligible for `moon ci` affected runs

  fmt-ts:
    description: 'Format TS/JS/JSON in place (Biome; what `bun run format` delegates to)'
    command: 'bunx biome format --write .'
    toolchains: ['system']
    options:
      cache: false # mutates the tree
      runInCI: false # tree-mutating: never eligible for `moon ci` affected runs

  fix:
    description: 'Auto-fix everything: Biome lint+format fixes, then cargo fmt'
    script: 'set -e; bunx biome check --write .; cargo fmt'
    toolchains: ['system']
    options:
      cache: false # mutates the tree
      runInCI: false # tree-mutating: never eligible for `moon ci` affected runs

  lint:
    # Depends on core:lint + lint-ts, not check-ts: check-ts (biome ci)
    # already covers Biome lint inside the ci gate, so this aggregate exists
    # for humans who want "lint everything" in one verb.
    description: 'Lint everything, denying warnings: Rust (clippy) + TS/JS/JSON (Biome)'
    deps:
      - 'core:lint'
      - '~:lint-ts'
    toolchains: ['system']
    options:
      cache: false # a check task: gates are never cached

  lint-ts:
    description: 'Lint TS/JS/JSON (Biome; what `bun run lint` delegates to)'
    command: 'bunx biome lint .'
    toolchains: ['system']
    inputs: ['**/*', '!**/node_modules/**']
    options:
      cache: false # a check task: gates are never cached

  check-ts:
    description: 'Lint + format-check all TS/JS/JSON (biome ci; what `bun run check` delegates to)'
    command: 'bunx biome ci .'
    toolchains: ['system']
    inputs: ['**/*', '!**/node_modules/**']
    options:
      cache: false # in the ci gate: gates are never cached

  fmt-check-ts:
    description: 'Verify TS/JS/JSON formatting (Biome; what `bun run format:check` delegates to)'
    command: 'bunx biome format .'
    toolchains: ['system']
    inputs: ['**/*', '!**/node_modules/**']
    options:
      cache: false # a check task: gates are never cached

  typos:
    description: 'Source-code spell check (CI gate; config in _typos.toml)'
    command: 'typos'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  machete:
    description: 'Detect unused Cargo dependencies (CI gate)'
    command: 'cargo machete'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  audit:
    description: 'Supply-chain checks over the root workspace (needs cargo-deny; CI audits.yml adds the fuzz workspace)'
    command: 'cargo deny check'
    toolchains: ['system']
    options:
      cache: false # a check task: gates are never cached

  # ----- rust builds --------------------------------------------------------

  build-release:
    description: 'Build the release binary'
    command: 'cargo build --release'
    toolchains: ['system']
    options:
      # cargo owns target/ and its own incremental cache; a moon cache hit
      # must never stand in for a missing build artifact.
      cache: false

  build-repro:
    description: 'Deterministic release build (path-remapped, --locked)'
    command: 'bun scripts/build-repro.ts'
    toolchains: ['system']
    options:
      cache: false # release ceremony: must really run
      runInCI: false # ceremony: only ever run deliberately, never by `moon ci`

  # ----- typescript aggregates ----------------------------------------------

  typecheck:
    description: 'Type-check every TS project (extension, tests, scripts, src/packages/shared)'
    script: |
      set -e
      bunx tsc -p src/apps/extension
      bunx tsc -p tests/browser
      bunx tsc -p tests/interop
      bunx tsc -p tests/harness
      bunx tsc -p scripts
      bunx tsc -p src/packages/shared
    toolchains: ['system']
    options:
      # In the ci gate, and the extension tsconfig extends the generated
      # (gitignored, unhashable) .wxt/tsconfig.json: never cache this.
      cache: false

  test-ts:
    description: 'Unit-test shared + extension + web (the `bun run test` set)'
    deps:
      - 'shared:test'
      - 'extension:test'
      - 'web:test'
      - '~:check-harness-driver'
    toolchains: ['system']
    options:
      cache: false
      runDepsInParallel: false

  test-browser:
    # SAFETY: only ever run against an isolated Chrome for Testing via
    # CHROME_BIN - never a browser holding a real session (tests/README.md).
    description: 'DOM + smoke + security proofs (needs bun + isolated Chrome via CHROME_BIN; builds the extension first)'
    deps: ['extension:build']
    script: |
      set -e
      (cd tests/browser && bun dom_test.ts)
      bun tests/browser/ext_test.ts
      bun tests/browser/security_browser_test.ts
    toolchains: ['system']
    options:
      cache: false # a gating suite (CI's browser job): gates are never cached
      runInCI: false # needs an isolated Chrome; CI's browser job provides its own

  # ----- container test environment (compose.yaml; never in CI) --------------
  # The container is the isolation: no host browser, host toolchain, or host process is in its reach.
  # The host side needs the engine (docker, or podman via CONTAINER_ENGINE=podman) plus the bun, git,
  # and moon that run these tasks. scripts/compose-run.ts supplies what only the host knows.

  ci-container:
    description: 'THE GATE inside the container test environment (docker; CONTAINER_ENGINE=podman switches)'
    command: 'bun scripts/compose-run.ts ci'
    toolchains: ['system']
    options:
      cache: false # a gate run: gates are never cached
      runInCI: false # CI runs the gate natively; the container is the local isolation

  test-browser-container:
    description: 'Browser suites inside the container under xvfb with BB_REQUIRE_BROWSER=1 (a skipped suite fails as in CI); no test Chrome on the host'
    command: 'bun scripts/compose-run.ts browser'
    toolchains: ['system']
    options:
      cache: false # a gating suite run: gates are never cached
      runInCI: false # local-verification convenience; CI's browser job is canonical

  shell-container:
    description: 'Interactive bash inside the container test environment, the checkout bind-mounted at /work'
    command: 'bun scripts/compose-run.ts shell'
    toolchains: ['system']
    options:
      cache: false # interactive: must really run
      runInCI: false
      interactive: true

  test-integration:
    description: 'Real E2E integration (opt-in; real binary + isolated Chrome + extension)'
    deps:
      - '~:build-release'
      - 'extension:build'
    command: 'bun tests/browser/integration_e2e.ts'
    env:
      BB_REAL_E2E: '1'
    toolchains: ['system']
    options:
      cache: false # a gating suite: gates are never cached
      runInCI: false # opt-in; needs an isolated Chrome

  fuzz-smoke:
    description: 'Bounded fuzz smoke over every cargo-fuzz target (needs nightly + cargo-fuzz; skips if missing)'
    command: 'bun scripts/fuzz-smoke.ts'
    toolchains: ['system']
    options:
      cache: false
      runInCI: false

  check-fuzz-smoke:
    description: 'Unit tests for the fuzz-smoke driver (flag parsing, failure-report contract)'
    command: 'bun test scripts/fuzz-smoke.test.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-harness-driver:
    description: 'Unit test for the harness-smoke driver (--mint-seeds refuses an output dir inside the repository)'
    command: 'bun test tests/harness/run.test.ts'
    toolchains: ['system']
    options:
      cache: false # a check task: gates are never cached

  check-fuzz-workspace:
    description: >-
      Cargo-check the excluded fuzz workspace (stable is enough to compile it) so fuzz targets
      cannot rot outside the main build; CI runs the same check in checks.yml's rust job
    command: 'cargo check --locked --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets'
    toolchains: ['system']
    options:
      cache: false

  doc:
    description: >-
      Build the workspace docs with rustdoc warnings denied (broken intra-doc links included); CI runs the
      same step in checks.yml's rust job
    command: 'cargo doc --workspace --no-deps --document-private-items'
    env:
      RUSTDOCFLAGS: '-D warnings'
    toolchains: ['system']
    options:
      cache: false

  # ----- python protocol suites (uv-provisioned interpreter) -----------------

  check-uv:
    # The protocol suites run under the exact interpreter pinned in
    # .python-version, provisioned by uv, so local runs and CI cannot diverge
    # (a PATH python3 already bit us once: 3.12 vs 3.14 subprocess
    # semantics). No fallback by design - fail loudly with an install hint.
    description: 'Fail loudly if uv (which provisions the pinned Python) is missing'
    script: |
      if ! command -v uv >/dev/null 2>&1; then
        echo "error: uv not found - it provisions the Python pinned in .python-version for the protocol suites" >&2
        echo "install it via proto (proto install uv), or: curl -LsSf https://astral.sh/uv/install.sh | sh   (or: brew install uv)" >&2
        exit 1
      fi
    toolchains: ['system']
    options:
      cache: false # a check task: gates are never cached

  # The three protocol suites are stdlib unittest modules under tests/protocol
  # (discovery, so a new test cannot be forgotten); --no-project because the
  # harness is stdlib-only by design (its independence from our code and from
  # any package is the point) - never add dependencies to it.
  test-e2e:
    description: 'Protocol-layer e2e tests (drives the real release binary)'
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p e2e.py -v'
    toolchains: ['system']
    options:
      cache: false # a gating suite: gates are never cached

  test-adversarial:
    description: "Adversarial break-in suite (CI's adversarial job; drives the real release binary)"
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p adversarial.py -v'
    toolchains: ['system']
    options:
      cache: false # a gating suite: gates are never cached

  test-chaos:
    description: "Fault-injection chaos suite (CI's chaos job; drives the real release binary)"
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p chaos.py -v'
    toolchains: ['system']
    options:
      cache: false # a gating suite: gates are never cached

  # ----- contract codegen (the Rust core is the single source, ADR-0028) ----

  gen:
    description: 'Regenerate ALL generated TS from Rust: the shared contract modules'
    deps:
      - '~:gen-shared'
    toolchains: ['system']
    options:
      cache: false # mutates the tree
      runInCI: false # tree-mutating: never eligible for `moon ci` affected runs
      runDepsInParallel: false

  gen-shared:
    description: 'Regenerate the TS contract modules from the Rust core (src/packages/shared/src/*.gen.ts)'
    script: |
      set -e
      bun scripts/gen-ops.ts
      bun scripts/gen-envelope.ts
      bunx biome format --write \
        src/packages/shared/src/ops.gen.ts \
        src/packages/shared/src/identity.gen.ts \
        src/packages/shared/src/errors.gen.ts \
        src/packages/shared/src/protocol.gen.ts \
        src/packages/shared/src/enclave.gen.ts \
        src/packages/shared/src/enclave-fixture.gen.ts \
        src/packages/shared/src/envelope-wire.gen.ts \
        src/packages/shared/src/audit.gen.ts \
        src/packages/shared/src/policy.gen.ts
    toolchains: ['system']
    options:
      cache: false # mutates the tree; check-gen diffs its output

  gen-icons:
    description: 'Render the extension icon rasters from the assets/icon/ SVGs (build artifacts, gitignored)'
    command: 'bun scripts/gen-icons.ts'
    toolchains: ['system']
    options:
      cache: false # cheap, and a dep of gate tasks: never cached

  check-gen:
    # The checked-in generated TS must match what the Rust core emits today,
    # and the envelope generator's fail-closed rules (G1-G5) must hold. The
    # diff pathspec covers every generated module (*.gen.ts, tracked or
    # newly written - the porcelain check catches untracked output); the
    # hand-written files sharing the directory are deliberately out of
    # scope, so local WIP there cannot false-fail the staleness gate.
    description: 'Staleness gate for the generated shared contract modules + envelope generator fail-closed rules'
    deps: ['~:gen-shared']
    script: |
      set -e
      git diff --exit-code -- 'src/packages/shared/src/*.gen.ts' || {
        echo "error: generated contract code is stale - run 'moon run gen' after editing the Rust catalogue/taxonomy or wire types" >&2
        exit 1
      }
      untracked="$(git status --porcelain -- 'src/packages/shared/src/*.gen.ts' | grep '^??' || true)"
      if [ -n "$untracked" ]; then
        echo "error: the generators wrote generated modules that are not tracked - commit them:" >&2
        printf '%s\n' "$untracked" >&2
        exit 1
      fi
      bun test scripts/gen-envelope.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-envelope:
    # Envelope asymmetry gate: the hand-written layer over the generated
    # wire schemas (Rust schemars vs Zod z.toJSONSchema) must stay within
    # the pinned parser asymmetries; base freshness is check-gen's job.
    # The bun test run covers the gate's classifier-coverage rule against
    # tables a live run cannot mutate (writer-only tag classified, pin gone
    # stale).
    description: 'Envelope asymmetry gate: hand-written Zod layer stays within the pinned parser asymmetries'
    script: |
      set -e
      bun scripts/check-envelope-parity.ts
      bun test scripts/check-envelope-parity.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-gen-isolation:
    # Gen-only tooling must stay out of the shipped binary's graph, and only `cargo tree -e normal` sees that
    # graph: the core's self dev-dependency switches the envelope-schema feature on workspace-wide, so
    # cargo-deny (even with dev-dependencies excluded) sees a core -> schemars edge that never links.
    #   p256, ts-rs  -> refused anywhere in the graph
    #   schemars     -> allowed only through rmcp (its runtime tool-schema model)
    description: 'Gen-only tooling (p256, ts-rs; schemars outside rmcp) stays out of the shipped binary dependency graph'
    script: |
      set -eu
      tree="$(cargo tree -e normal -p chromium-bridge --locked)"
      for crate in p256 ts-rs; do
        if printf '%s\n' "$tree" | grep -q " $crate v"; then
          echo "$crate leaked into the chromium-bridge binary dependency graph" >&2
          exit 1
        fi
      done
      # rmcp must be schemars's only direct dependent (depth 1 of the inverse tree). An inverse tree that
      # does not resolve (two schemars majors: the leak itself) fails here instead of passing silently.
      if printf '%s\n' "$tree" | grep -q " schemars v"; then
        inverse="$(cargo tree -e normal -p chromium-bridge --locked -i schemars --prefix depth)"
        if ! printf '%s\n' "$inverse" | grep -q '^0schemars '; then
          echo "could not resolve the schemars inverse tree:" >&2
          printf '%s\n' "$inverse" >&2
          exit 1
        fi
        if printf '%s\n' "$inverse" | grep -E '^1[^0-9]' | grep -qv '^1rmcp '; then
          echo "schemars reached the chromium-bridge binary graph outside rmcp:" >&2
          printf '%s\n' "$inverse" >&2
          exit 1
        fi
      fi
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  # ----- Touch ID runbooks (macOS, USER-RUN) ---------------------------------

  touchid-proof:
    # Touch ID proof for the host (USER-RUN: raises a real Touch ID prompt).
    # Builds the release binary, then enrolls the enclave key with it; on
    # success the machine is genuinely enrolled. Undo with the same binary's
    # `revoke` subcommand. The data-protection keychain refuses an ad-hoc
    # build (src/packages/core/src/enclave/macos.rs), so the binary must be
    # codesigned with an application identifier first; no task does that
    # signing yet.
    description: 'USER-RUN runbook: enroll the enclave key via the release host binary (raises a real Touch ID prompt)'
    deps: ['~:build-release']
    script: './target/release/chromium-bridge pair'
    toolchains: ['system']
    options:
      cache: false # Touch ID ceremony: must really run
      runInCI: false
      interactive: true

  touchid-gates:
    # Touch ID gate demo (USER-RUN, macOS: raises a REAL Touch ID prompt).
    # Runs the per-action presence gate - the one page_eval / page_upload
    # use - so you can watch the Enclave sign under Touch ID, then prints
    # the three capability-grant commands (pair-client, unkill, policy set)
    # for you to run in your own terminal: those require a real interactive
    # TTY by design (anti tap-phishing), which a task runner cannot provide.
    # Needs an enrolled Enclave key (run `moon run touchid-proof` first).
    description: 'USER-RUN runbook: demo the Touch ID presence gates (runs the per-action gate; prints the rest)'
    deps: ['~:build-release']
    script: |
      set -eu
      BIN="./target/release/chromium-bridge"
      echo "== 1/4 per-action presence (page_eval / page_upload gate) =="
      echo "   expect a Touch ID prompt now:"
      "$BIN" presence-selftest
      echo
      echo "== 2/4 client pairing  +  3/4 kill-switch release =="
      echo "   These GRANT or RESTORE capability, so from the CLI they require a"
      echo "   real interactive terminal (a background or piped process must not be"
      echo "   able to raise that Touch ID sheet). A task runner has no TTY, so run"
      echo "   these yourself in this terminal - each raises a Touch ID prompt:"
      echo
      echo "     BIN=\"$BIN\""
      echo "     \"\$BIN\" pair-client --name touchid-demo --hash abababababababababababababababababababababababababababababababab   # Touch ID"
      echo "     \"\$BIN\" revoke-client --name touchid-demo                                    # instant, no prompt"
      echo "     \"\$BIN\" kill && \"\$BIN\" unkill                                              # kill instant; unkill = Touch ID"
      echo
      echo "== 4/4 policy grant (signed GRANT lane, ADR-0032) =="
      echo "   'policy set' mints a fresh SIGNED baseline, so it is signature-only:"
      echo "   the Touch ID sheet has no floor to fall through to. Run these yourself"
      echo "   in this terminal - approve the first, DECLINE the second:"
      echo
      echo "     \"\$BIN\" policy set --page-eval on       # APPROVE the sheet, then check:"
      echo "     \"\$BIN\" audit                           #   PolicyWrite ok, auth=touch_id"
      echo "     \"\$BIN\" policy set --page-eval on       # DECLINE the sheet: the command must"
      echo "     \"\$BIN\" audit                           #   refuse (no floor fallthrough) and"
      echo "                                             #   audit PolicyWrite refused"
      echo "     \"\$BIN\" policy restrict --page-eval off # roll the grant back (free lane,"
      echo "                                             #   no prompt; or: policy rollback)"
      echo
      echo "touchid-gates: the per-action gate above raised a live Touch ID prompt;"
      echo "the three capability-grant gates need a real terminal - commands printed above."
    toolchains: ['system']
    options:
      cache: false # Touch ID ceremony: must really run
      runInCI: false
      interactive: true

  # ----- version + repo hygiene checks ---------------------------------------

  sync-version:
    description: 'Propagate the Cargo.toml version into the JS package manifests'
    command: 'bun scripts/sync-version.ts'
    toolchains: ['system']
    options:
      cache: false # mutates the tree
      runInCI: false # tree-mutating: never eligible for `moon ci` affected runs

  check-version:
    description: 'Verify the crate, JS package, and release-please versions agree'
    command: 'bun scripts/check-version.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-extension-id:
    description: 'Verify the pinned key, extension ID, and built manifest agree'
    command: 'bun scripts/check-extension-id.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-cjk:
    description: 'Verify CJK text stays inside the zh locale files and translated docs'
    command: 'bun scripts/check-cjk.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-typography:
    description: 'No typographic look-alike characters in any tracked file (exemptions in .typography-allow)'
    script: |
      set -e
      bun scripts/check-typography.ts
      bun test scripts/check-typography.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-toolchain:
    description: 'The duplicated toolchain pins (.prototools vs rust-toolchain.toml, package.json, checks.yml) must agree'
    command: 'bun scripts/check-toolchain.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-hasher:
    description: 'No tracked file may match a .moon/workspace.yml hasher.ignorePattern (a stale-cache hole)'
    command: 'bun scripts/check-moon-hasher.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-ignored:
    description: 'No tracked file may be matched by .gitignore (Biome and knip would skip it silently)'
    command: 'bun scripts/check-gitignore-tracked.ts'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-yaml:
    # The local yamllint version is pinned here; the managed ci.yml's
    # yamllint job installs its own (unpinned - a template-sync decision,
    # ADR-0033), so bump this pin when CI surfaces a rule this version
    # lacks. uvx comes with uv (proto-provisioned).
    description: 'Lint every YAML file (yamllint, strict; the local version pin)'
    command: 'uvx yamllint@1.38.0 -s .'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-actions:
    # actionlint is a residual-gap tool like typos (no first-party proto
    # plugin): `brew install actionlint` once (docs/development.md). The
    # managed ci.yml runs its own actionlint job, so a local version skew
    # can at worst surface a finding early.
    description: 'Lint the GitHub Actions workflows (actionlint; install once with `brew install actionlint`)'
    command: 'actionlint'
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-docs-literals:
    description: 'Living docs state the canonical identifiers, paths, and protocol versions exactly'
    script: |
      set -e
      bun scripts/check-docs-literals.ts
      bun test scripts/check-docs-literals.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-docs-policy:
    description: 'Risk matrix, tool-count headlines, and settings-defaults docs match the catalogue and settings schema'
    script: |
      set -e
      bun scripts/check-docs-policy.ts
      bun test scripts/check-docs-policy.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  check-compose:
    description: 'compose.yaml + compose.podman.yaml stay within the Compose Specification subset both docker compose and podman compose implement'
    script: |
      set -e
      bun scripts/check-compose-compat.ts
      bun test scripts/check-compose-compat.test.ts
    toolchains: ['system']
    options:
      cache: false # in the ci gate: gates are never cached

  # ----- interop suites (not in the `moon run ci` aggregate) -----------------

  test-interop:
    # Drives the release binary with the OFFICIAL TypeScript MCP client SDK v2
    # (@modelcontextprotocol/client, spec 2026-07-28) over stdio - the one
    # real third-party modern client. Gated in CI by checks.yml's interop
    # job, which invokes the underlying command directly (moon's CI mode
    # does not resolve runInCI:false tasks); runInCI stays false so
    # affected-only `moon ci` runs do not trip on a suite that needs the
    # release binary.
    description: 'MCP client SDK v2 interop suite (official @modelcontextprotocol/client over stdio; CI runs it via checks.yml)'
    deps:
      - '~:build-release'
    command: 'bun test tests/interop/sdk-client.test.ts'
    toolchains: ['system']
    options:
      cache: false # a check suite: never cached
      runInCI: false # checks.yml invokes the command directly (see above)

  # ----- agent-harness interop smoke (nightly workflow; not in the ci gate) --

  harness-smoke:
    # Needs the claude and codex CLIs on PATH, so nightly.yml's harness-smoke job installs them and runs
    # `bun tests/harness/run.ts` directly: moon does not resolve runInCI:false tasks when CI=true. Each
    # harness's opening method is logged as the ADR-0034 canary for retiring the legacy-initialize shim;
    # extra flags pass through (`moon run harness-smoke -- --mint-seeds <dir outside the repo>`).
    description: >-
      Agent-harness interop smoke: real harness CLIs connect to the stdio MCP server and run a
      fake-LLM live tool call (logs the ADR-0034 opening-method canary)
    deps: ['~:build-release']
    command: 'bun tests/harness/run.ts'
    toolchains: ['system']
    options:
      cache: false # a gating suite for the nightly workflow: never cached
      runInCI: false # needs harness CLIs; nightly.yml's harness-smoke job provides them
