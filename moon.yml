# Root project: the ci gate, the repo-wide aggregates, contract codegen, the python protocol suites, and the
# Touch ID runbooks. Unscoped task names resolve here via .moon/workspace.yml's defaultProject. Every task is
# uncached by the workspace default (.moon/tasks/all.yml says why).
#
# Three rules govern every `moon run`, whatever targets the caller names together, so no caller has to (the
# first two are read back from the resolved graph by scripts/check-moon-edges.ts):
#   runs bun or bunx                                    -> depends on check-deps (a tree not installed to bun.lock
#                                                          fails naming `moon run setup`), and bunx takes --no-install
#   reachable from `gate` (what the pre-commit hook runs) -> only bun, bunx, and the toolchain's cargo verbs: nothing
#                                                          another runtime or a separately installed binary provides
#                                                          (those run in `ci`, where CI provisions them); a cargo verb
#                                                          there depends on check-crates and takes --frozen (fmt
#                                                          reads no crates and has no such flag); a bun task whose
#                                                          script spawns cargo (gen-shared, check-gen, check-gen-isolation)
#                                                          carries the edge and the flag by convention, since the
#                                                          auditor sees only a task's own command
#   reads or writes src/packages/shared/src/*.gen.ts    -> options.mutex 'generated-contract', shared with gen-shared,
#                                                          so one invocation never overlaps a reader with the rewrite
# Nothing reachable from `gate` installs or fetches: `setup` is the one task that does, and nothing depends on
# it (`ci` adds tools CI provisions in its own steps, such as uv's). A dependency on gen-shared was rejected
# for the readers: it would put a cargo build into every TS task and into
# CI's build-free jobs, while check-gen already proves the committed modules fresh. build-repro, fuzz-smoke, and
# harness-smoke run before or without an install by contract (their scripts say so), and setup, check-deps, and
# check-crates are the install and its two checks, so those six are the only bun tasks without the first rule.
# The per-project moon.yml files follow the same rules.
#
# The build, ci, test, test-rust, test-ts, release, and gen aggregates set `runDepsInParallel: false`, so their
# steps run in the listed order. lint's two deps still run in parallel: clippy reads nothing gen-shared writes.
#
# `runInCI: false` marks a task `moon ci` must never pick up: tree-mutating ones, user-run ceremonies, and
# suites that need a browser, a release binary, or a harness CLI. moon resolves none of them when CI=true, so
# CI invokes those suites' commands directly (checks.yml interop, browser.yml, nightly.yml harness-smoke).
$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'typescript'
layer: 'tool'

tasks:
  # ----- front door ---------------------------------------------------------

  help:
    description: 'List every task with its description (the front door; raw JSON: `moon query tasks`)'
    deps: ['~:check-deps']
    command: 'bun scripts/help.ts'
    options:
      runInCI: false

  setup:
    # `rustup toolchain install` with no name installs the active toolchain (the Containerfile's rustup step
    # says the same); an inherited RUSTUP_TOOLCHAIN would make that another toolchain, so the script drops it
    # and the pin wins here as it does in check-crates.
    description: 'Run once per fresh checkout: install the bun workspace to bun.lock (lefthook wires the git hooks from its postinstall), the pinned Rust toolchain, and the crates of both cargo workspaces to their Cargo.lock'
    script: |
      set -e
      bun install --frozen-lockfile
      unset RUSTUP_TOOLCHAIN
      rustup toolchain install
      cargo fetch --locked
      cargo fetch --locked --manifest-path src/packages/core/fuzz/Cargo.toml
    options:
      runInCI: false

  check-deps:
    description: 'Every bun task depends on this: fail unless the bun workspace is installed to bun.lock, naming `moon run setup` (installs nothing)'
    command: 'bun scripts/check-deps.ts bun'
    inputs:
      - '/bun.lock'
      - '/**/package.json'
      - '!**/node_modules/**'

  check-crates:
    description: "Every cargo verb in the gate depends on this: fail unless the pinned toolchain is installed and both cargo workspaces' crates are fetched to their Cargo.lock, naming `moon run setup` (fetches nothing)"
    command: 'bun scripts/check-deps.ts cargo'
    inputs:
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/src/packages/core/fuzz/Cargo.lock'
      - '/rust-toolchain.toml'

  # ----- main aggregates ----------------------------------------------------

  build:
    description: 'Build everything: shared typecheck, extension, web app, scripts typecheck, cargo workspace'
    deps:
      - '~:check-deps'
      - 'shared:typecheck'
      - 'extension:build'
      - 'web:build'
    script: 'bunx --no-install tsc -p scripts && cargo build --workspace'
    options:
      mutex: 'generated-contract'
      runDepsInParallel: false

  gate:
    description: "THE PRE-COMMIT GATE (lefthook.yml runs it): every check the repository's own toolchain provides (bun, biome, tsc, vitest, cargo verbs); uncached, sequential, always full; `ci` adds the CI-only tools"
    deps:
      - 'core:fmt-check'
      - 'core:lint'
      - 'core:test'
      - 'core:test-doc'
      - 'core:test-loom'
      - '~:doc'
      - '~:typecheck'
      - '~:check-ts'
      - 'shared:test'
      - 'extension:test'
      - 'extension:build'
      - '~:hygiene'
      - '~:check-fuzz-workspace'
      - '~:test-fuzz'
      - '~:check-gen'
      - '~:check-envelope'
      - '~:check-gen-isolation'
    options:
      runDepsInParallel: false

  ci:
    description: 'THE GATE CI runs: gate, then the checks that need another runtime or a separately installed binary (typos, cargo-machete, the Python protocol e2e, yamllint, actionlint) or re-lock a scratch workspace (check-refresh-lockfiles); CI layers the OS matrix, linux-install, the adversarial/chaos suites, the browser suites, and the web build on top'
    deps:
      - '~:gate'
      - '~:typos'
      - '~:machete'
      - '~:test-e2e'
      - '~:check-refresh-lockfiles'
      - '~:check-yaml'
      - '~:check-actions'
    options:
      runDepsInParallel: false

  test:
    description: 'All tests that run without a browser: Rust (nextest + doctests), then protocol e2e'
    deps:
      - 'core:test'
      - 'core:test-doc'
      - '~:test-e2e'
    options:
      runDepsInParallel: false

  test-rust:
    description: 'Rust unit + integration tests (cargo-nextest), doctests, and the loom model check'
    deps:
      - 'core:test'
      - 'core:test-doc'
      - 'core:test-loom'
    options:
      runDepsInParallel: false

  release:
    description: 'Pre-release gate: versions consistent + full ci (release-please cuts the actual release)'
    deps:
      - '~:check-version'
      - '~:check-extension-id'
      - '~:ci'
    script: |
      echo "Release checks passed. Releases are cut by release-please: merge the rolling release PR (chore(main): release X.Y.Z) on a green main."
    options:
      runDepsInParallel: false

  install:
    description: 'USER-RUN: build the release binary, then register it with your browsers (doctor --fix)'
    deps: ['~:build-release']
    command: './target/release/chromium-bridge doctor --fix'
    options:
      runInCI: false

  # ----- dev loops (local only; never in CI) --------------------------------

  dev:
    description: 'Dev everything: extension (WXT) + web app (Astro) + a dev browser in one terminal; Ctrl-C stops all'
    deps: ['~:check-deps']
    command: 'bun scripts/dev.ts'
    preset: 'server'

  dev-web:
    # Not a `persistent` server task: the web project's dev script backgrounds the astro dev daemon itself
    # (`astro dev stop; ASTRO_DEV_BACKGROUND=1 astro dev`) and exits, so here it is a plain one-shot command.
    description: 'Docs site dev server only; replaces any already-running astro dev (`dev` supersets this)'
    deps: ['~:check-deps']
    command: 'bun run --cwd src/apps/web dev'
    options:
      runInCI: false

  # ----- quality ------------------------------------------------------------

  fmt:
    description: 'Format everything in place: Rust (cargo fmt) + TS/JS/JSON (Biome)'
    deps: ['~:check-deps']
    script: 'set -e; cargo fmt; bunx --no-install biome format --write .'
    options:
      mutex: 'generated-contract'
      runInCI: false

  fmt-ts:
    description: 'Format TS/JS/JSON in place (Biome; what `bun run format` delegates to)'
    deps: ['~:check-deps']
    command: 'bunx --no-install biome format --write .'
    options:
      mutex: 'generated-contract'
      runInCI: false

  fix:
    description: 'Auto-fix everything: Biome lint+format fixes, then cargo fmt'
    deps: ['~:check-deps']
    script: 'set -e; bunx --no-install biome check --write .; cargo fmt'
    options:
      mutex: 'generated-contract'
      runInCI: false

  lint:
    # lint-ts rather than check-ts: check-ts (biome ci) already covers Biome lint inside the ci gate, so this
    # aggregate exists for humans who want "lint everything" in one verb.
    description: 'Lint everything, denying warnings: Rust (clippy) + TS/JS/JSON (Biome)'
    deps:
      - 'core:lint'
      - '~:lint-ts'

  lint-ts:
    description: 'Lint TS/JS/JSON (Biome; what `bun run lint` delegates to)'
    deps: ['~:check-deps']
    command: 'bunx --no-install biome lint .'
    inputs: ['**/*', '!**/node_modules/**']
    options:
      mutex: 'generated-contract'

  check-ts:
    description: 'Lint + format-check all TS/JS/JSON, warnings fail (biome ci; what `bun run check` delegates to)'
    deps: ['~:check-deps']
    command: 'bunx --no-install biome ci . --error-on-warnings'
    inputs: ['**/*', '!**/node_modules/**']
    options:
      mutex: 'generated-contract'

  fmt-check-ts:
    description: 'Verify TS/JS/JSON formatting (Biome; what `bun run format:check` delegates to)'
    deps: ['~:check-deps']
    command: 'bunx --no-install biome format .'
    inputs: ['**/*', '!**/node_modules/**']
    options:
      mutex: 'generated-contract'

  typos:
    description: 'Source-code spell check (CI gate; config in _typos.toml)'
    command: 'typos'
    options:
      mutex: 'generated-contract'

  machete:
    description: 'Detect unused Cargo dependencies (CI gate)'
    command: 'cargo machete'

  audit:
    description: 'Supply-chain checks over the root workspace (needs cargo-deny; CI audits.yml adds the fuzz workspace)'
    command: 'cargo deny check'

  # ----- rust builds --------------------------------------------------------

  build-release:
    description: 'Build the release binary'
    command: 'cargo build --release'

  build-repro:
    description: 'Deterministic release build (path-remapped, --locked)'
    command: 'bun scripts/build-repro.ts'
    options:
      runInCI: false

  # ----- typescript aggregates ----------------------------------------------

  typecheck:
    description: 'Type-check every TS project (extension, tests, scripts, src/packages/shared)'
    deps: ['~:check-deps']
    script: |
      set -e
      bunx --no-install tsc -p src/apps/extension
      bunx --no-install tsc -p tests/browser
      bunx --no-install tsc -p tests/interop
      bunx --no-install tsc -p tests/harness
      bunx --no-install tsc -p scripts
      bunx --no-install tsc -p src/packages/shared
    options:
      mutex: 'generated-contract'

  test-ts:
    description: 'Unit-test shared + extension + web (the `bun run test` set)'
    deps:
      - 'shared:test'
      - 'extension:test'
      - 'web:test'
      - '~:check-harness-driver'
    options:
      runDepsInParallel: false

  test-browser:
    # SAFETY: only ever run against an isolated Chrome for Testing via CHROME_BIN, never a browser holding a
    # real session (tests/README.md). The runner builds the extension and owns the suite-ran canary.
    description: 'DOM + smoke + security proofs (needs bun + isolated Chrome via CHROME_BIN; builds the extension first)'
    deps: ['~:check-deps']
    command: 'bun tests/browser/run_all.ts'
    options:
      mutex: 'generated-contract'
      runInCI: false

  # ----- container test environment (compose.yaml; never in CI) --------------
  # The container is the isolation: no host browser, host toolchain, or host process is in its reach.
  # The host side needs the engine (docker, or podman via CONTAINER_ENGINE=podman) plus the bun, git,
  # and moon that run these tasks. scripts/compose-run.ts supplies what only the host knows.

  ci-container:
    description: 'THE GATE inside the container test environment (docker; CONTAINER_ENGINE=podman switches)'
    deps: ['~:check-deps']
    command: 'bun scripts/compose-run.ts ci'
    options:
      runInCI: false

  test-presence-exchange:
    # SAFETY: the same isolated-browser rule as test-browser. Drives the REAL release host (control-plane mode in a
    # throwaway runtime dir) through the real extension, so it needs the Rust build the browser CI job does not
    # have, which is why it is not in run_all.ts.
    description: 'The WebAuthn exchange end to end against the real host in the isolated Chrome (needs CHROME_BIN; builds the extension and the release binary first)'
    deps: ['~:install-deps', '~:build-release']
    script: |
      set -e
      bun run --cwd src/apps/extension build
      bun tests/browser/presence_exchange_test.ts
    options:
      runInCI: false

  test-browser-container:
    description: 'Browser suites inside the container under xvfb with BB_REQUIRE_BROWSER=1 (a skipped suite fails as in CI); no test Chrome on the host'
    deps: ['~:check-deps']
    command: 'bun scripts/compose-run.ts browser'
    options:
      runInCI: false

  shell-container:
    description: 'Interactive bash inside the container test environment, the checkout bind-mounted at /work'
    deps: ['~:check-deps']
    command: 'bun scripts/compose-run.ts shell'
    options:
      runInCI: false
      interactive: true

  test-integration:
    description: 'Real E2E integration (opt-in; real binary + isolated Chrome + extension)'
    deps:
      - '~:check-deps'
      - '~:build-release'
      - 'extension:build'
    command: 'bun tests/browser/integration_e2e.ts'
    env:
      BB_REAL_E2E: '1'
    options:
      mutex: 'generated-contract'
      runInCI: false

  fuzz-seeds:
    description: 'Generate the fuzz seed corpus and JSON dictionary from the production types (fuzz/src/seeds/; stable rust)'
    command: 'cargo run --locked --manifest-path src/packages/core/fuzz/Cargo.toml --example seeds'
    options:
      cache: false
      runInCI: false

  fuzz-smoke:
    description: 'Bounded fuzz smoke over every cargo-fuzz target (needs nightly + cargo-fuzz; skips if missing)'
    deps:
      - '~:fuzz-seeds'
    command: 'bun scripts/fuzz-smoke.ts'
    options:
      runInCI: false

  check-fuzz-smoke:
    description: 'Unit tests for the fuzz-smoke driver (flag parsing, failure-report contract)'
    deps: ['~:check-deps']
    command: 'bun test scripts/tests/fuzz-smoke.test.ts'

  check-harness-driver:
    description: 'Unit tests for the harness-smoke driver (--mint-seeds refuses an output dir inside the repository; the sweep removes only the dirs of a dead owner; SIGTERM stops its children, removes its dirs, and exits by the signal)'
    deps: ['~:check-deps']
    command: 'bun test tests/harness/run.test.ts'

  check-refresh-lockfiles:
    description: 'Unit test for the release-PR lockfile refresh (a bumped scratch workspace re-locks into one commit; needs cargo, git, bun)'
    deps: ['~:check-deps']
    command: 'bun test scripts/tests/refresh-lockfiles.test.ts'

  check-fuzz-workspace:
    description: >-
      Cargo-check the excluded fuzz workspace (stable is enough to compile it) so fuzz targets
      cannot rot outside the main build; CI runs the same check in checks.yml's rust job
    deps: ['~:check-crates']
    command: 'cargo check --frozen --manifest-path src/packages/core/fuzz/Cargo.toml --all-targets'

  test-fuzz:
    description: >-
      The fuzz workspace's own tests (stable rust): every generated seed runs through its target
      in-process and its reader agrees with its label
    deps: ['~:check-crates']
    command: 'cargo test --frozen --manifest-path src/packages/core/fuzz/Cargo.toml'

  doc:
    description: >-
      Build the workspace docs with rustdoc warnings denied (broken intra-doc links included); CI runs the
      same step in checks.yml's rust job
    deps: ['~:check-crates']
    command: 'cargo doc --frozen --workspace --no-deps --document-private-items'
    env:
      RUSTDOCFLAGS: '-D warnings'

  # ----- python protocol suites (uv-provisioned interpreter) -----------------

  check-uv:
    # The protocol suites run under the exact interpreter pinned in .python-version, provisioned by uv, so
    # local runs and CI cannot diverge (a PATH python3 already bit us once: 3.12 vs 3.14 subprocess
    # semantics). No fallback by design.
    description: 'Fail loudly if uv (which provisions the pinned Python) is missing'
    deps: ['~:check-deps']
    command: 'bun scripts/check-uv.ts'

  # The three protocol suites are stdlib unittest modules under tests/protocol
  # (discovery, so a new test cannot be forgotten); --no-project because the
  # harness is stdlib-only by design (its independence from our code and from
  # any package is the point) - never add dependencies to it.
  test-e2e:
    description: 'Protocol-layer e2e tests (drives the real release binary)'
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p e2e.py -v'

  test-adversarial:
    description: "Adversarial break-in suite (CI's protocol matrix; drives the real release binary)"
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p adversarial.py -v'

  test-chaos:
    description: "Fault-injection chaos suite (CI's protocol matrix; drives the real release binary)"
    deps:
      - '~:check-uv'
      - '~:build-release'
    command: 'uv run --no-project --isolated python -m unittest discover -s tests/protocol -p chaos.py -v'

  # ----- contract codegen (the Rust core is the single source) --------------

  gen:
    description: 'Regenerate ALL generated TS from Rust: the shared contract modules'
    deps:
      - '~:gen-shared'
    options:
      runInCI: false
      runDepsInParallel: false

  gen-shared:
    # The scripts spawn `cargo run --frozen` for the emitters: the header's convention for a cargo-spawning script.
    description: 'Regenerate the TS contract modules from the Rust core (src/packages/shared/src/*.gen.ts)'
    deps: ['~:check-deps', '~:check-crates']
    script: |
      set -e
      bun scripts/gen-ops.ts
      bun scripts/gen-envelope.ts
      bunx --no-install biome format --write \
        src/packages/shared/src/ops.gen.ts \
        src/packages/shared/src/identity.gen.ts \
        src/packages/shared/src/errors.gen.ts \
        src/packages/shared/src/protocol.gen.ts \
        src/packages/shared/src/enclave.gen.ts \
        src/packages/shared/src/enclave-fixture.gen.ts \
        src/packages/shared/src/envelope.gen.ts \
        src/packages/shared/src/audit.gen.ts \
        src/packages/shared/src/host.gen.ts \
        src/packages/shared/src/policy.gen.ts
    options:
      mutex: 'generated-contract'

  gen-icons:
    description: 'Render the extension icon rasters from the assets/icon/ SVGs (build artifacts, gitignored)'
    deps: ['~:check-deps']
    command: 'bun scripts/gen-icons.ts'

  check-gen:
    # scripts/check-gen.ts judges only the generated modules (tracked or newly written), so local WIP in the
    # hand-written files sharing the directory cannot false-fail the staleness gate.
    description: 'Staleness gate for the generated shared contract modules + envelope generator fail-closed rules'
    deps: ['~:check-deps', '~:check-crates', '~:gen-shared']
    script: |
      set -e
      bun scripts/check-gen.ts
      bun test scripts/tests/check-gen.test.ts scripts/tests/gen-envelope.test.ts
    options:
      mutex: 'generated-contract'

  check-envelope:
    # The generated enforced validators differ from their faithful bases exactly as the asymmetry table declares
    # (every entry's probes, both reader rules), the inbound classifiers match the generated reader plan, and the
    # hand-written refinements stay pinned. Base freshness is check-gen's job; the bun test covers the gate's
    # rules against tables a live run cannot mutate.
    description: 'Envelope asymmetry gate: generated validators match the asymmetry table, classifiers match the reader plan'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-envelope.ts
      bun test scripts/tests/check-envelope.test.ts
    options:
      mutex: 'generated-contract'

  check-gen-isolation:
    # Only `cargo tree -e normal` sees the shipped graph (scripts/check-gen-isolation.ts says why cargo-deny
    # cannot): ts-rs is refused anywhere in it, schemars only through rmcp.
    description: 'Gen-only tooling (ts-rs; schemars outside rmcp) stays out of the shipped binary dependency graph'
    deps: ['~:check-deps', '~:check-crates']
    script: |
      set -e
      bun scripts/check-gen-isolation.ts
      bun test scripts/tests/check-gen-isolation.test.ts

  # ----- version + repo hygiene checks ---------------------------------------

  # The one list of the bun-side checks that need no build: CI's hygiene job (checks.yml) runs this task and
  # `ci` depends on it, so a check added here runs in both.
  hygiene:
    description: 'Every bun-side check that needs no build (versions, pins, CJK, typography, docs parity, compose); CI runs the same task'
    deps:
      - '~:check-version'
      - '~:check-extension-id'
      - '~:check-toolchain'
      - '~:check-pins'
      - '~:check-hasher'
      - '~:check-moon-edges'
      - '~:check-ignored'
      - '~:check-cjk'
      - '~:check-typography'
      - '~:check-fuzz-smoke'
      - '~:check-harness-driver'
      - '~:check-docs-literals'
      - '~:check-docs-policy'
      - '~:check-planning-refs'
      - '~:check-compose'
      - '~:check-ci-scripts'
      - '~:check-docs-probe'
      - '~:check-architecture'
      - '~:check-docs-locales'
    options:
      runDepsInParallel: false

  check-ci-scripts:
    description: "Unit tests for the TypeScript behind CI's workflow steps (image digest and tag, Linux registration scenarios, installer smoke, mutants shard, auto-format commit, release packaging, uv check)"
    deps: ['~:check-deps']
    command: 'bun test scripts/tests/ci-image.test.ts scripts/tests/linux-registration.test.ts scripts/tests/installer-smoke.test.ts scripts/tests/mutants-shard.test.ts scripts/tests/auto-format-commit.test.ts scripts/tests/release-package.test.ts scripts/tests/check-uv.test.ts'
    options:
      mutex: 'generated-contract'

  check-version:
    description: 'Verify the crate, JS package, and release-please versions agree'
    deps: ['~:check-deps']
    command: 'bun scripts/check-version.ts'

  check-extension-id:
    description: 'Verify the built extension manifest keeps the pinned key and permission surface, and identity.rs stays the only definition site'
    deps: ['~:check-deps']
    command: 'bun scripts/check-extension-id.ts'
    options:
      mutex: 'generated-contract'

  check-cjk:
    description: 'Verify CJK text stays inside the zh locale files and translated docs (one git grep -P; the wrapper owns the excludes and the engine control)'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-cjk.ts
      bun test scripts/tests/check-cjk.test.ts
    options:
      mutex: 'generated-contract'

  check-typography:
    description: 'No typographic look-alike characters in any tracked file (exemptions in .typography-allow)'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-typography.ts
      bun test scripts/tests/check-typography.test.ts
    options:
      mutex: 'generated-contract'

  check-toolchain:
    description: 'The bun pin copies (.prototools, package.json, .bun-version) must agree, and .prototools must leave rust to rustup and python to uv'
    deps: ['~:check-deps']
    command: 'bun scripts/check-toolchain.ts'

  check-pins:
    description: 'The pin reader CI bootstraps from (scripts/pin.ts) refuses a tool pinned in both .prototools and the Containerfile, twice, or nowhere; then every pin of both files is swept through that rule'
    deps: ['~:check-deps']
    script: 'bun test scripts/tests/pin.test.ts && bun scripts/pin.ts --all'

  check-hasher:
    description: 'No tracked file may match a .moon/workspace.yml hasher.ignorePattern (a stale-cache hole)'
    deps: ['~:check-deps']
    command: 'bun scripts/check-moon-hasher.ts'

  check-moon-edges:
    description: "The header's first two rules, read from moon's resolved task graph: bun tasks depend on root:check-deps, and the gate's graph holds only own-toolchain commands (cargo verbs with the check-crates edge and --frozen); plus check-deps's own tests"
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-moon-edges.ts
      bun test scripts/tests/check-moon-edges.test.ts scripts/tests/check-deps.test.ts

  check-ignored:
    description: 'No tracked file may be matched by .gitignore (Biome and knip would skip it silently; one git ls-files call behind a typed wrapper)'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-ignored.ts
      bun test scripts/tests/check-ignored.test.ts scripts/tests/lib.test.ts

  check-yaml:
    # The managed ci.yml's yamllint job installs its own, unpinned, version (a template-sync decision), so
    # bump this pin when CI surfaces a rule this version lacks. uvx comes with uv (proto-provisioned).
    description: 'Lint every YAML file (yamllint, strict; the local version pin)'
    command: 'uvx yamllint@1.38.0 -s .'

  check-actions:
    # actionlint has no first-party proto plugin: `brew install actionlint` once (docs/development.md). The
    # managed ci.yml runs its own actionlint job, so a local version skew can at worst surface a finding early.
    description: 'Lint the GitHub Actions workflows (actionlint; install once with `brew install actionlint`)'
    command: 'actionlint'

  check-docs-literals:
    description: 'Living docs state the canonical identifiers, paths, and protocol versions exactly'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-docs-literals.ts
      bun test scripts/tests/check-docs-literals.test.ts
    options:
      mutex: 'generated-contract'

  check-docs-policy:
    description: 'Risk matrix, tool-count headlines, and settings-defaults docs match the catalogue and settings schema'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-docs-policy.ts
      bun test scripts/tests/check-docs-policy.test.ts
    options:
      mutex: 'generated-contract'

  check-planning-refs:
    description: 'No planning references (retired design-record numbers, decision/finding/phase tags, audit codes) in the covered sources (TypeScript, Rust, TOML, Python, shell, docs, web)'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-planning-refs.ts
      bun test scripts/tests/check-planning-refs.test.ts
    options:
      mutex: 'generated-contract'

  check-compose:
    description: 'compose.yaml + compose.podman.yaml stay within the Compose Specification subset both docker compose and podman compose implement'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-compose-compat.ts
      bun test scripts/tests/check-compose-compat.test.ts

  check-docs-probe:
    description: 'Every paragraph and list item of the living docs under the 70-word cap and every path they name real; pre-rewrite findings are allowed by docs/.probe-baseline, which fails when an allowance goes stale (CHANGELOG.md is release-please output and stays out)'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/docs-probe.ts --baseline docs/.probe-baseline 'README*.md' CONTRIBUTING.md GOVERNANCE.md 'docs/**/*.md' .github/SECURITY.md
      bun test scripts/tests/docs-probe.test.ts

  check-architecture:
    description: 'The TS import graph equals architecture.yml in both directions, the module map rendered into docs/architecture.md is current, and every diagram box and demonstration link on that page names real code'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/arch-lint.ts
      bun scripts/render-architecture-map.ts --page docs/architecture.md --check
      bun scripts/check-architecture-page.ts --page docs/architecture.md --repo-url https://github.com/Vivswan/chromium-bridge/blob/main/ --expect-diagrams 6
      bun test scripts/tests/arch-lint.test.ts scripts/tests/render-architecture-map.test.ts scripts/tests/check-architecture-page.test.ts
    options:
      mutex: 'generated-contract'

  gen-architecture-map:
    description: 'Rewrite the generated module-map region of docs/architecture.md from architecture.yml (check-architecture verifies it)'
    deps: ['~:check-deps']
    command: 'bun scripts/render-architecture-map.ts --page docs/architecture.md'
    options:
      runInCI: false

  check-docs-locales:
    description: 'docs/zh-cn and docs/zh-tw, once present, mirror the English docs tree file-for-file with their README; absent locales pass'
    deps: ['~:check-deps']
    script: |
      set -e
      bun scripts/check-docs-locales.ts
      bun test scripts/tests/check-docs-locales.test.ts

  # ----- interop suites (not in the `moon run ci` aggregate) -----------------

  test-interop:
    # Drives the release binary with the OFFICIAL TypeScript MCP client SDK v2 (@modelcontextprotocol/client,
    # spec 2026-07-28) over stdio, the one real third-party modern client.
    description: 'MCP client SDK v2 interop suite (official @modelcontextprotocol/client over stdio; CI runs it via checks.yml)'
    deps:
      - '~:check-deps'
      - '~:build-release'
    command: 'bun test tests/interop/sdk-client.test.ts'
    options:
      runInCI: false

  # ----- agent-harness interop smoke (nightly workflow; not in the ci gate) --

  harness-smoke:
    # Needs the claude and codex CLIs on PATH (nightly.yml's harness-smoke job installs them). Each harness's
    # opening method is logged as the canary for retiring the legacy-initialize shim; extra flags pass through
    # (`moon run harness-smoke -- --mint-seeds <dir outside the repo>`).
    description: >-
      Agent-harness interop smoke: real harness CLIs connect to the stdio MCP server and run a
      fake-LLM live tool call (logs the opening-method canary)
    deps: ['~:build-release']
    command: 'bun tests/harness/run.ts'
    options:
      runInCI: false
