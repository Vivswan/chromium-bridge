# cargo-deny config - supply-chain gate for the Rust crate.
# Run: cargo deny check   (CI: audits.yml, via ci.yml's gate and nightly.yml's daily rerun)

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Our own crates are source-available (LICENSE.md, no SPDX id) and publish =
# false; skip them here - this gate is about DEPENDENCY licenses. Note
# private.ignore keys off `publish = false` on ANY crate in the graph, not
# workspace membership, so a vendored path dep marked publish = false would
# also be skipped - review before adding one. Only allow permissive (or, for
# unmodified deps, weak file-level copyleft) licenses, and only those
# cargo-deny actually selects from the tree (for OR expressions it records
# just the chosen arm). A new license here fails the check on purpose -
# review it before widening the list.
private = { ignore = true }
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
  "BSD-3-Clause",
  # foldhash, hashbrown's default hasher, reached only through governor (the per-relay rate limiter).
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
